<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>社群总人数趋势 | EC玩家社群站</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0a0a12;--panel:#10101a;--line-soft:rgba(255,255,255,.06);--line:rgba(255,202,52,.10);
    --ink:#e8e4dc;--ink-2:#8a8578;--ink-3:#5a5448;
    --gold:#ffca34;--up:#6fbf73;--down:#e06c7d;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  html,body{overflow-x:hidden}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;padding-bottom:60px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px}
  header{padding:34px 0 8px}
  h1{font-size:22px;letter-spacing:.1em}
  h1 a{color:var(--ink)}
  .crumb{font-size:12px;color:var(--ink-3);margin-bottom:10px}
  .crumb a{color:var(--ink-2)}
  .crumb a:hover{color:var(--gold)}
  a{text-decoration:none;color:inherit}

  /* 范围切换 */
  .range{display:flex;gap:8px;margin:18px 0}
  .range button{background:var(--panel);border:1px solid var(--line-soft);color:var(--ink-2);border-radius:9px;padding:8px 18px;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s}
  .range button.on{color:var(--gold);border-color:rgba(255,202,52,.55);background:rgba(255,202,52,.06)}

  .panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:22px;margin-bottom:16px}
  .panel h2{font-size:14px;color:var(--ink-2);letter-spacing:.12em;font-weight:600;margin-bottom:4px}
  .panel .sub{font-size:12px;color:var(--ink-3);margin-bottom:14px}

  /* 总览大数字 */
  .hero-num{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .hero-num b{font-family:var(--mono);font-size:44px;color:var(--gold);line-height:1.1}
  .delta{font-family:var(--mono);font-size:14px}
  .delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--ink-3)}
  .chart{width:100%;height:220px;display:block;margin-top:14px;cursor:grab;touch-action:pan-y}
  .chart:active{cursor:grabbing}
  .zbar{display:flex;gap:8px;align-items:center;margin-top:10px}
  .zbar button{background:rgba(255,255,255,.04);border:1px solid var(--line-soft);color:var(--ink-2);border-radius:8px;padding:5px 13px;font-size:12px;cursor:pointer;font-family:inherit;transition:.2s}
  .zbar button:hover{color:var(--gold);border-color:rgba(255,202,52,.45)}
  .zbar .zinfo{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}

  /* 涨跌榜 */
  .movers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.movers{grid-template-columns:minmax(0,1fr)}}
  .mv-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.035);font-size:13px}
  .mv-row:last-child{border-bottom:none}
  .mv-name{flex:1 1 0;width:0;min-width:0;white-space:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;color:var(--ink)}
  .mv-name::-webkit-scrollbar{display:none}
  .mv-d{flex:0 0 auto;white-space:nowrap;font-family:var(--mono);font-size:13px}
  .mv-d.up{color:var(--up)} .mv-d.down{color:var(--down)}

  /* 群列表 */
  .g-row{border-bottom:1px solid rgba(255,255,255,.035)}
  .g-row:last-child{border-bottom:none}
  .g-head{display:flex;align-items:center;gap:12px;padding:12px 4px;cursor:pointer;transition:background .2s}
  .g-head:hover{background:rgba(255,255,255,.02)}
  .g-slide{flex:1 1 0;width:0;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .g-slide::-webkit-scrollbar{display:none}
  .g-track{display:inline-flex;align-items:baseline;gap:8px;white-space:nowrap;padding-right:6px}
  .g-name{white-space:nowrap;font-size:13.5px}
  .g-id{flex:0 0 auto;white-space:nowrap;color:var(--ink-3);font-family:var(--mono);font-size:11.5px;cursor:pointer}
  .g-cur{flex:0 0 auto;white-space:nowrap;font-family:var(--mono);font-size:14px;color:var(--ink);text-align:right}
  .g-delta{flex:0 0 auto;white-space:nowrap;font-family:var(--mono);font-size:12px;min-width:64px;text-align:right}
  .g-arrow{color:var(--ink-3);font-size:11px;transition:transform .25s}
  .g-row.open .g-arrow{transform:rotate(90deg)}
  .g-body{display:none;padding:4px 4px 16px}
  .g-row.open .g-body{display:block}
  .spark{width:100%;height:120px;display:block}

  .empty{color:var(--ink-3);font-size:13px;text-align:center;padding:30px 0}
  .status{font-size:12.5px;color:var(--ink-3);text-align:center;padding:20px 0}
  .status.err{color:var(--down)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="crumb"><a href="./EC社群自治.html">← 返回社群数据中心</a></div>
    <h1>社群总人数趋势</h1>
  </header>

  <div class="range" id="rangeBtns">
    <button data-d="1">24 小时</button>
    <button data-d="7" class="on">7 天</button>

  <!-- 总人数曲线 -->

    <div class="zbar" id="totalZbar">
      <button data-z="out">− 缩小</button><button data-z="in">＋ 放大</button><button data-z="reset">重置</button>
      <span class="zinfo" id="totalZ"></span>
    </div>
  </div>

  <!-- EC 全服在线人数曲线 -->
  <div class="panel">
    <h2>EC 全服在线人数</h2>
    <div class="sub" id="ecSub">分钟级采样 · play.easecation.net</div>
    <div class="hero-num">
      <b id="ecNow">--</b>
      <span class="delta flat" id="ecDelta"></span>
    </div>
    <svg class="chart" id="ecChart" preserveAspectRatio="none" role="img" aria-label="EC 全服在线趋势"></svg>
    <div class="zbar" id="ecZbar">
      <button data-z="out">− 缩小</button><button data-z="in">＋ 放大</button><button data-z="reset">重置</button>
      <span class="zinfo" id="ecZ"></span>
    </div>
  </div>

  <!-- 布吉岛全服在线人数曲线 -->
  <div class="panel">
    <h2>布吉岛全服在线人数</h2>
    <div class="sub" id="bjSub">分钟级采样 · 网易网络游戏列表</div>
    <div class="hero-num">
      <b id="bjNow">--</b>

    </div>
    <svg class="chart" id="bjChart" preserveAspectRatio="none" role="img" aria-label="布吉岛全服在线趋势"></svg>
    <div class="zbar" id="bjZbar">
      <button data-z="out">− 缩小</button><button data-z="in">＋ 放大</button><button data-z="reset">重置</button>
      <span class="zinfo" id="bjZ"></span>
    </div>

  <!-- 涨跌榜 -->
  <div class="panel">
    <h2>涨跌榜（对比所选范围起点）</h2>

      <div><div class="sub">📈 增长最快</div><div id="upList"><div class="empty">数据攒集中…</div></div></div>
      <div><div class="sub">📉 流失最多</div><div id="downList"><div class="empty">数据攒集中…</div></div></div>

  <!-- 各群曲线 -->

    <h2>各群曲线</h2>

  <!-- 布吉岛数据接入（管理员）：网易登录态短信验证 -->
  <details class="panel" id="bjAdmin" style="cursor:pointer">
    <summary style="font-weight:600">布吉岛数据接入（仅管理员）</summary>
    <div class="sub" style="margin:8px 0">用任一网易 MC 账号短信验证一次即可（建议小号），登录态只存在本站数据库里，用于每分钟读取布吉岛在线人数。</div>
    <div style="display:flex;flex-direction:column;gap:8px;max-width:340px">
      <input id="bjSecret" type="password" placeholder="管理密钥" style="padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:inherit">
      <input id="bjPhone" type="tel" placeholder="网易账号手机号" style="padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:inherit">
      <div style="display:flex;gap:8px">
        <input id="bjCode" type="text" inputmode="numeric" placeholder="短信验证码" style="flex:1;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:inherit">
        <button id="bjSend" style="padding:8px 12px;border-radius:8px">发验证码</button>

      <input id="bj4399Pwd" type="password" placeholder="4399 密码" style="padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:inherit">

        <div style="display:flex;gap:8px;margin-top:6px">
          <input id="bjCapText" type="text" placeholder="输入图中字符" style="flex:1;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:inherit">
          <button id="bjCapGo" style="padding:8px 12px;border-radius:8px">提交</button>
        </div>
      </div>
      <div class="sub" id="bjStatus">查询状态中…</div>

  <p class="status" id="footNote"></p>
</div>

<script>
/* 从主页面跳来时，若之前在播放则续播（仅在上次确实播放过时才触发，不打扰静音访客） */
if(window.EC_NBS){ EC_NBS.resumeIfPlayed(); }
</script>
<script>
(function(){
  "use strict";
  var $ = function(s){return document.querySelector(s)};
  var D = window.EC_DATA || {};
  var groups = [];
  (D.official||[]).forEach(function(g){ if(g.id) groups.push(g); });
  (D.player||[]).forEach(function(g){ if(g.id) groups.push(g); });
  var nameOf = {}; groups.forEach(function(g){ nameOf[g.id]=g.name; });

  var curDays = 7, cache = {};

  /* ---------- 画图（纯 SVG，QQ/微信浏览器兼容） ---------- */
  var SVGNS = "http://www.w3.org/2000/svg";
  function drawLine(svg, pts, opts){
    opts = opts || {};
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    var W = svg.clientWidth || 300, H = svg.clientHeight || 120;
    svg.setAttribute("viewBox", "0 0 "+W+" "+H);
    function el(tag, attrs){
      var e = document.createElementNS(SVGNS, tag);
      for(var k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }
    if(!pts || pts.length < 2){
      var t0 = el("text",{x:W/2, y:H/2, "text-anchor":"middle", fill:"#5a5448", "font-size":12});
      t0.textContent = "数据攒集中，采样满两个点后出图";
      svg.appendChild(t0); return;
    }
    var pad = {l:opts.yAxis?46:6, r:8, t:10, b:opts.xAxis?22:8};
    var x0=pad.l, x1=W-pad.r, y0=H-pad.b, y1=pad.t;
    var vals = pts.map(function(p){return p[1]});
    var max = Math.max.apply(null,vals), min = Math.min.apply(null,vals);
    if(max===min){ max+=1; min=Math.max(0,min-1); }
    function X(i){ return x0+(x1-x0)*i/(pts.length-1); }
    function Y(v){ return y0-((v-min)/(max-min))*(y0-y1); }
    var color = opts.color||"#ffca34";

    // 网格 + Y 轴
    if(opts.yAxis){
      for(var i=0;i<=4;i++){
        var gy=y0-(y0-y1)*i/4;
        svg.appendChild(el("line",{x1:x0,y1:gy,x2:x1,y2:gy,stroke:"rgba(255,255,255,.07)","stroke-width":1}));
        var lt = el("text",{x:4, y:gy+3, fill:"#5a5448", "font-size":10});
        lt.textContent = Math.round(min+(max-min)*i/4);
        svg.appendChild(lt);
      }
    }
    // 折线路径
    var dpath = "";
    pts.forEach(function(p,i){
      dpath += (i?"L":"M")+X(i).toFixed(1)+" "+Y(p[1]).toFixed(1);
    });
    // 渐变填充（先画填充再画线）
    if(opts.fill !== "none"){
      var fpath = dpath + "L"+x1.toFixed(1)+" "+y0.toFixed(1)+"L"+x0.toFixed(1)+" "+y0.toFixed(1)+"Z";
      svg.appendChild(el("path",{d:fpath, fill:opts.fill||"rgba(255,202,52,.10)", stroke:"none"}));
    }
    svg.appendChild(el("path",{d:dpath, fill:"none", stroke:color, "stroke-width":1.8, "stroke-linejoin":"round", "stroke-linecap":"round"}));
    // 末端点
    var lx=X(pts.length-1), ly=Y(vals[vals.length-1]);
    svg.appendChild(el("circle",{cx:lx, cy:ly, r:3.2, fill:color}));
    // X 轴时间
    if(opts.xAxis){
      var f=function(d){var p=function(n){return (n<10?"0":"")+n};return (d.getMonth()+1)+"/"+d.getDate()+" "+p(d.getHours())+":"+p(d.getMinutes())};
      var t1=el("text",{x:x0, y:H-5, fill:"#5a5448", "font-size":10});
      t1.textContent = f(new Date(pts[0][0])); svg.appendChild(t1);
      var t2=el("text",{x:x1, y:H-5, fill:"#5a5448", "font-size":10, "text-anchor":"end"});
      t2.textContent = f(new Date(pts[pts.length-1][0])); svg.appendChild(t2);
    }
  }

  function fmtDelta(n){
    if(n>0) return '<span class="mv-d up">↑ +'+n.toLocaleString()+'</span>';
    if(n<0) return '<span class="mv-d down">↓ '+n.toLocaleString()+'</span>';
    return '<span class="mv-d" style="color:var(--ink-3)">— 0</span>';
  }

  /* ---------- 图表缩放/平移：滚轮(指针锚定) · 拖拽 · 双指捏合 · 单指横滑 ---------- */
  var chartPts = {total:[], ec:[], bj:[]};
  var chartZoom = {total:{zoom:1,start:0}, ec:{zoom:1,start:0}, bj:{zoom:1,start:0}};
  function fmtWin(ts){ var d=new Date(ts),p=function(n){return (n<10?"0":"")+n}; return (d.getMonth()+1)+"/"+d.getDate()+" "+p(d.getHours())+":"+p(d.getMinutes()); }
  function chartSlice(key){
    var pts=chartPts[key], n=pts.length;
    if(n<2) return pts;
    var st=chartZoom[key];
    var i0=Math.floor(st.start*(n-1));
    var i1=Math.ceil((st.start+1/st.zoom)*(n-1));
    if(i1>n-1) i1=n-1;
    if(i0>=i1) i0=i1-1;
    if(i0<0) i0=0;
    /* 向窗口两侧各扩一个点：索引式 X 下折线正好顶到图区边缘，视觉上连续不中断 */
    return pts.slice(Math.max(0,i0-1), Math.min(n-1,i1+1)+1);
  }
  function redrawChart(key){
    var all=chartPts[key], n=all.length, st=chartZoom[key];
    var pts=chartSlice(key);
    if(key==="total") drawLine($("#totalChart"), pts, {yAxis:true, xAxis:true});
    else if(key==="bj") drawLine($("#bjChart"), pts, {yAxis:true, xAxis:true, color:"#34d399", fill:"rgba(52,211,153,.10)"});
    else drawLine($("#ecChart"), pts, {yAxis:true, xAxis:true, color:"#7dd3fc", fill:"rgba(125,211,252,.10)"});
    var zi=$("#"+key+"Z");
    if(zi){
      if(n>1 && st.zoom>1){
        var i0=Math.max(0,Math.floor(st.start*(n-1))), i1=Math.min(n-1,Math.ceil((st.start+1/st.zoom)*(n-1)));
        zi.textContent = fmtWin(all[i0][0])+" ~ "+fmtWin(all[i1][0]);
      }else zi.textContent = "";
    }
  }
  function bindChartZoom(key, maxZ){
    var svg=$("#"+key+"Chart"); if(!svg) return;
    var st=chartZoom[key];
    function clamp(){
      st.zoom=Math.min(Math.max(1,st.zoom),maxZ);
      st.start=Math.min(Math.max(0,st.start),1-1/st.zoom);
    }
    function fracOf(clientX){
      var r=svg.getBoundingClientRect();
      var f=(clientX-r.left-46)/Math.max(1,r.width-46-8);
      return Math.min(1,Math.max(0,f));
    }
    function zoomAt(f,frac){
      var anchor=st.start+frac/st.zoom;
      st.zoom=Math.min(maxZ,Math.max(1,st.zoom*f));
      st.start=anchor-frac/st.zoom;
      clamp(); redrawChart(key);
    }
    var bar=$("#"+key+"Zbar");
    if(bar) bar.addEventListener("click",function(e){
      var b=e.target.closest("button"); if(!b) return;
      if(window.EC_SFX) EC_SFX.play("click");
      if(b.dataset.z==="in") zoomAt(1.6,.5);
      else if(b.dataset.z==="out") zoomAt(1/1.6,.5);
      else { st.zoom=1; st.start=0; redrawChart(key); }
    });
    svg.addEventListener("dblclick",function(){ st.zoom=1; st.start=0; redrawChart(key); });
    /* 滚轮：以指针位置为锚点缩放 */
    svg.addEventListener("wheel",function(e){
      e.preventDefault();
      zoomAt(e.deltaY<0?1.25:1/1.25, fracOf(e.clientX));
    },{passive:false});
    /* 鼠标拖拽平移 */
    var mDown=null;
    svg.addEventListener("mousedown",function(e){ mDown={x:e.clientX,start:st.start,zoom:st.zoom}; e.preventDefault(); });
    window.addEventListener("mousemove",function(e){
      if(!mDown) return;
      var r=svg.getBoundingClientRect();
      st.start=mDown.start-(e.clientX-mDown.x)/Math.max(1,r.width)/mDown.zoom;
      clamp(); redrawChart(key);
    });
    window.addEventListener("mouseup",function(){ mDown=null; });
    /* 触屏：双指捏合缩放（中心锚定）；单指横滑平移（竖向手势留给页面滚动，X5 兼容） */
    var tMode=null,tX=0,tY=0,tStart=0,tZoom=1,pDist=0,pFrac=0,pAt=0,pZoom0=1;
    svg.addEventListener("touchstart",function(e){
      if(e.touches.length===2){
        tMode="pinch";
        pDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
        pFrac=fracOf((e.touches[0].clientX+e.touches[1].clientX)/2);
        pAt=st.start+pFrac/st.zoom; pZoom0=st.zoom;
      }else if(e.touches.length===1){
        tMode=null; tX=e.touches[0].clientX; tY=e.touches[0].clientY; tStart=st.start; tZoom=st.zoom;
      }
    },{passive:true});
    svg.addEventListener("touchmove",function(e){
      if(e.touches.length===2 && tMode==="pinch" && pDist>0){
        e.preventDefault();
        var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
        st.zoom=Math.min(maxZ,Math.max(1,pZoom0*d/pDist));
        st.start=pAt-pFrac/st.zoom;
        clamp(); redrawChart(key); return;
      }
      if(e.touches.length===1){
        var dx=e.touches[0].clientX-tX, dy=e.touches[0].clientY-tY;
        if(tMode===null){
          if(st.zoom>1 && Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)*1.2) tMode="pan";
          else if(Math.abs(dy)>10) tMode="scroll";
        }
        if(tMode==="pan"){
          e.preventDefault();
          var r=svg.getBoundingClientRect();
          st.start=tStart-dx/Math.max(1,r.width)/tZoom;
          clamp(); redrawChart(key);
        }
      }
    },{passive:false});
    function tEnd(e){
      if(e.touches.length<2){ pDist=0; if(tMode==="pinch") tMode=null; }
      if(!e.touches.length) tMode=null;
    }
    svg.addEventListener("touchend",tEnd);
    svg.addEventListener("touchcancel",tEnd);
  }

  /* ---------- 加载与渲染 ---------- */
  function load(days){
    curDays = days;
    /* 切换范围时复位三张图的缩放/平移 */
    chartZoom.total.zoom=1; chartZoom.total.start=0;
    chartZoom.ec.zoom=1; chartZoom.ec.start=0;
    chartZoom.bj.zoom=1; chartZoom.bj.start=0;
    document.querySelectorAll("#rangeBtns button").forEach(function(b){
      b.classList.toggle("on", +b.dataset.d===days);
    });
    /* 同域代理 ./api/history（服务器端读 GitHub 最新数据，国内手机可通）；代理异常时回退站点同源副本 */
    var p = cache.all ? Promise.resolve(cache.all) :
      fetch("./api/history?_="+Date.now())
        .then(function(r){ return r.ok ? r.json() : null; })
        .catch(function(){ return null; })
        .then(function(j0){
          if(j0) return j0;
          return fetch("./history.json?_="+Date.now()).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
        })
        .then(function(j){ cache.all=j; return j; });

    p.then(function(j){
      var cutoff = Date.now() - days*864e5;
      var pts = (j.points||[]).map(function(p){
        var g = p.g || {};
        var total = 0; Object.keys(g).forEach(function(k){ total += g[k]; });
        return {ts: p.ts, total: total, groups: g, c: p.c, t: p.t, ec: (typeof p.ec==="number"?p.ec:null), bj: (typeof p.bj==="number"?p.bj:null)};
      }).filter(function(p){return p.ts>=cutoff});
      /* 推断完整度：新点看 c 字段，老点用群数占比推断，漏群的点不纳入总人数曲线 */
      var expN = 0;
      pts.forEach(function(p){
        if(typeof p.t==="number" && p.t>expN) expN=p.t;
        var gn=Object.keys(p.groups).length; if(gn>expN) expN=gn;
      });
      pts.forEach(function(p){
        p._inc = (typeof p.c==="number") ? p.c<0.9
               : (expN>0 && Object.keys(p.groups).length < expN*0.9);
      });
      renderTotal(pts);
      renderEC(pts);
      renderBJ(pts);
      renderGroups(pts);
      var incN = pts.filter(function(p){ return p._inc; }).length;
      $("#footNote").textContent = "共 "+pts.length+" 个采样点 · 每 6 小时自动记录一次 · 历史从首次采样起累积"
        + (incN ? " · 已剔除 "+incN+" 个漏群的不完整采样点" : "")
        + (j.updated ? " · 最近采样 "+j.updated : "");
    }).catch(function(e){
      $("#footNote").textContent = "历史数据暂不可用：" + e.message + "（等待 GitHub Actions 首次采样，或检查 history.json 是否已生成）";
      $("#footNote").className = "status err";
      $("#groupList").innerHTML = '<div class="empty">等待首次采样…</div>';
    });
  }

  function renderTotal(pts){
    var cpts = pts.filter(function(p){ return !p._inc; });  /* 漏群的不完整点会造成假性暴跌，剔除 */
    var tp = cpts.map(function(p){return [p.ts, p.total]});
    if(!tp.length){ $("#totalNow").textContent="--"; chartPts.total=[]; redrawChart("total"); return; }
    var last = tp[tp.length-1][1], first = tp[0][1], diff = last-first;
    $("#totalNow").textContent = last.toLocaleString();
    var d = $("#totalDelta");
    d.className = "delta " + (diff>0?"up":diff<0?"down":"flat");
    d.textContent = (diff>0?"↑ +":diff<0?"↓ ":"") + (diff!==0?diff.toLocaleString():"持平") + " · 区间内";
    var firstT = new Date(tp[0][0]);
    $("#totalSub").textContent = "每 6 小时采样 · 区间起点 " + firstT.toLocaleString("zh-CN") + " · 图上可拖动/缩放";
    chartPts.total = tp; redrawChart("total");
  }

  /* EC 全服在线人数曲线（分钟级采样，蓝色调区分） */
  function renderEC(pts){
    var ep = pts.filter(function(p){ return typeof p.ec==="number"; })
                .map(function(p){ return [p.ts, p.ec]; });
    if(!ep.length){
      $("#ecNow").textContent="--";
      $("#ecDelta").textContent="";
      $("#ecSub").textContent = "等待首次采样 · 配置 cron 后每分钟自动记录";
      chartPts.ec=[]; redrawChart("ec");
      return;
    }
    var last = ep[ep.length-1][1], first = ep[0][1], diff = last-first;
    $("#ecNow").textContent = last.toLocaleString();
    var d = $("#ecDelta");
    d.className = "delta " + (diff>0?"up":diff<0?"down":"flat");
    d.textContent = (diff>0?"↑ +":diff<0?"↓ ":"") + (diff!==0?diff.toLocaleString():"持平") + " · 区间内";
    $("#ecSub").textContent = "分钟级采样 · " + ep.length + " 个点 · 图上可拖动/缩放 · 当前模式见服务器 MOTD";
    chartPts.ec = ep; redrawChart("ec");
  }

  /* 布吉岛全服在线人数曲线（分钟级采样，绿色调区分；数据来自网易网络游戏列表） */
  function renderBJ(pts){
    var bp = pts.filter(function(p){ return typeof p.bj==="number"; })
                .map(function(p){ return [p.ts, p.bj]; });
    if(!bp.length){
      $("#bjNow").textContent="--";
      $("#bjDelta").textContent="";
      chartPts.bj=[]; redrawChart("bj");
      return;
    }
    var last = bp[bp.length-1][1], first = bp[0][1], diff = last-first;
    $("#bjNow").textContent = last.toLocaleString();
    var d = $("#bjDelta");
    d.className = "delta " + (diff>0?"up":diff<0?"down":"flat");
    d.textContent = (diff>0?"↑ +":diff<0?"↓ ":"") + (diff!==0?diff.toLocaleString():"持平") + " · 区间内";
    $("#bjSub").textContent = "分钟级采样 · " + bp.length + " 个点 · 图上可拖动/缩放";
    chartPts.bj = bp; redrawChart("bj");
  }

  function renderGroups(pts){
    // 计算每个群首末值
    var info = {};
    pts.forEach(function(p){
      Object.keys(p.groups).forEach(function(id){
        if(!info[id]) info[id]={first:null,last:null,series:[]};
        var c = p.groups[id];
        if(info[id].first===null) info[id].first=c;
        info[id].last=c;
        info[id].series.push([p.ts,c]);
      });
    });
    var rows = Object.keys(info).map(function(id){
      var it = info[id];
      /* 判断是否在区间起点就有数据：没有则是新出现/恢复，不算增长 */
      var hadAtStart = pts.length>0 && pts[0].groups && (id in pts[0].groups);
      return {
        id: id, name: nameOf[id]||("群 "+id),
        first: it.first, last: it.last,
        delta: hadAtStart ? (it.last - it.first) : null,
        isNew: !hadAtStart,
        series: it.series
      };
    });

    // 涨跌榜（排除新出现的群）
    var ups = rows.filter(function(r){return r.delta!==null && r.delta>0}).sort(function(a,b){return b.delta-a.delta}).slice(0,5);
    var downs = rows.filter(function(r){return r.delta!==null && r.delta<0}).sort(function(a,b){return a.delta-b.delta}).slice(0,5);
    $("#upList").innerHTML = ups.length ? ups.map(function(r){
      return '<div class="mv-row"><span class="mv-name">'+esc(r.name)+'</span>'+fmtDelta(r.delta)+'</div>';
    }).join("") : '<div class="empty">暂无增长</div>';
    $("#downList").innerHTML = downs.length ? downs.map(function(r){
      return '<div class="mv-row"><span class="mv-name">'+esc(r.name)+'</span>'+fmtDelta(r.delta)+'</div>';
    }).join("") : '<div class="empty">暂无流失</div>';

    // 群列表（按当前人数排序）
    rows.sort(function(a,b){return (b.last||0)-(a.last||0)});
    var box = $("#groupList");
    if(!rows.length){ box.innerHTML='<div class="empty">暂无历史数据，等待首次采样…</div>'; return; }
    box.innerHTML = "";
    rows.forEach(function(r, i){
      var row = document.createElement("div"); row.className="g-row";
      row.innerHTML =
        '<div class="g-head">'+
          '<span class="g-slide"><span class="g-track"><span class="g-name">'+esc(r.name)+'</span>'+
          '<span class="g-id" title="点击复制群号">'+r.id+'</span></span></span>'+
          '<span class="g-delta">'+(r.isNew?'<span style="color:var(--ink-3);font-size:11px">新出现</span>':r.delta>0?'<span class="mv-d up">+'+r.delta+'</span>':r.delta<0?'<span class="mv-d down">'+r.delta+'</span>':'<span style="color:var(--ink-3)">0</span>')+'</span>'+
          '<span class="g-cur">'+(r.last!==null?r.last.toLocaleString():"--")+'</span>'+
          '<span class="g-arrow">▶</span>'+
        '</div>'+
        '<div class="g-body"><svg class="spark" preserveAspectRatio="none"></svg></div>';
      var idEl = row.querySelector(".g-id");
      idEl.addEventListener("click", function(e){
        e.stopPropagation();
        var t = idEl.textContent;
        if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t); }
        idEl.textContent = "已复制"; setTimeout(function(){ idEl.textContent = t; }, 1200);
      });
      row.querySelector(".g-head").addEventListener("click", function(){
        var open = row.classList.toggle("open");
        if(window.EC_SFX) EC_SFX.play(open ? "open" : "click");
        if(open) drawLine(row.querySelector(".spark"), r.series, {yAxis:true, xAxis:true, color:"#7dd3fc", fill:"rgba(125,211,252,.08)"});
      });
      box.appendChild(row);
    });
  }

  function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

  $("#rangeBtns").addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(b){ if(window.EC_SFX) EC_SFX.play("click"); load(+b.dataset.d); }
  });
  bindChartZoom("total", 50);   /* 群人数是 6 小时点，50 倍足够看到单点 */
  bindChartZoom("ec", 300);     /* EC 是分钟级点，允许放到很细 */
  bindChartZoom("bj", 300);     /* 布吉岛同为分钟级点 */

  /* ---------- 布吉岛数据接入（管理员短信验证） ---------- */
  (function(){
    var stEl = $("#bjStatus");
    function say(t, err){ stEl.textContent = t; stEl.style.color = err ? "#f87171" : ""; }
    function call(body){
      return fetch("./api/bj-auth", {
        method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)
      }).then(function(r){ return r.json().catch(function(){ return {error:"HTTP "+r.status}; }); });
    }
    function refreshStatus(){
      var s = $("#bjSecret").value.trim();
      if(!s){ say("输入管理密钥后可查看接入状态"); return; }
      call({action:"status", secret:s}).then(function(j){
        if(j.error){ say("状态查询失败：" + j.error, true); return; }
        if(j.logged) say("✅ 已接入（" + j.phone + "，" + j.since + " 起）——每分钟自动采样中");
        else if(j.dead) say("⚠️ 登录态已失效（网易侧登出/改密会导致），请重新短信验证", true);
        else say("未接入：填写手机号 → 发验证码 → 验证并启用");
      });
    }
    $("#bjSecret").addEventListener("change", refreshStatus);
    $("#bjSend").addEventListener("click", function(){
      var body = {action:"send_sms", secret:$("#bjSecret").value.trim(), phone:$("#bjPhone").value.trim()};
      say("正在发送…");
      call(body).then(function(j){
        if(j.error){ say("发送失败：" + j.error, true); return; }
        say(j.msg || "已发送");
      }).catch(function(e){ say("发送失败：" + e.message, true); });
    });
    $("#bjLogin").addEventListener("click", function(){
      var body = {action:"verify", secret:$("#bjSecret").value.trim(), phone:$("#bjPhone").value.trim(), code:$("#bjCode").value.trim()};
      say("正在验证登录（约 5–15 秒）…");
      call(body).then(function(j){
        if(j.error){ say("验证失败：" + j.error, true); return; }
        say("✅ " + (j.msg || "登录成功"));
      }).catch(function(e){ say("验证失败：" + e.message, true); });
    });
    $("#bj4399Btn").addEventListener("click", function(){
      var body = {action:"login4399", secret:$("#bjSecret").value.trim(), account:$("#bj4399Acc").value.trim(), password:$("#bj4399Pwd").value};
      say("4399 登录中（自动识别验证码，约 10–30 秒）…");
      $("#bjCapBox").style.display = "none";
      call(body).then(function(j){
        if(j.needCaptcha){
          // 自动识别不了，把图展示出来让人工输
          $("#bjCapImg").src = j.imageBase64;
          $("#bjCapBox").style.display = "block";
          say("自动识别失败，请照着图输入验证码后点「提交」", true);
          return;
        }
        if(j.error){ say("4399 登录失败：" + j.error, true); return; }
        say("✅ " + (j.msg || "登录成功"));
      }).catch(function(e){ say("4399 登录失败：" + e.message, true); });
    });
    $("#bjCapGo").addEventListener("click", function(){
      var body = {action:"login4399_captcha", secret:$("#bjSecret").value.trim(), code:$("#bjCapText").value.trim()};
      say("正在用你输入的验证码登录…");
      call(body).then(function(j){
        if(j.error){ say("登录失败：" + j.error, true); return; }
        $("#bjCapBox").style.display = "none";
        say("✅ " + (j.msg || "登录成功"));
      }).catch(function(e){ say("登录失败：" + e.message, true); });
    });
    say("展开后可管理布吉岛数据接入");
  })();

  load(7);
})();
</script>
</body>
