<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>社群总人数趋势 | EC玩家社群站</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0a0a12;--panel:#10101a;--line-soft:rgba(255,255,255,.06);--line:rgba(255,202,52,.10);
    --ink:#e8e4dc;--ink-2:#8a8578;--ink-3:#5a5448;
    --gold:#ffca34;--up:#6fbf73;--down:#e06c7d;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;padding-bottom:60px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px}
  header{padding:34px 0 8px}
  h1{font-size:22px;letter-spacing:.1em}
  h1 a{color:var(--ink)}
  .crumb{font-size:12px;color:var(--ink-3);margin-bottom:10px}
  .crumb a{color:var(--ink-2)}
  .crumb a:hover{color:var(--gold)}
  a{text-decoration:none;color:inherit}

  /* 范围切换 */
  .range{display:flex;gap:8px;margin:18px 0}
  .range button{background:var(--panel);border:1px solid var(--line-soft);color:var(--ink-2);border-radius:9px;padding:8px 18px;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s}
  .range button.on{color:var(--gold);border-color:rgba(255,202,52,.55);background:rgba(255,202,52,.06)}

  .panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:22px;margin-bottom:16px}
  .panel h2{font-size:14px;color:var(--ink-2);letter-spacing:.12em;font-weight:600;margin-bottom:4px}
  .panel .sub{font-size:12px;color:var(--ink-3);margin-bottom:14px}

  /* 总览大数字 */
  .hero-num{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .hero-num b{font-family:var(--mono);font-size:44px;color:var(--gold);line-height:1.1}
  .delta{font-family:var(--mono);font-size:14px}
  .delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--ink-3)}
  .chart{width:100%;height:220px;display:block;margin-top:14px}

  /* 涨跌榜 */
  .movers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.movers{grid-template-columns:1fr}}
  .mv-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.035);font-size:13px}
  .mv-row:last-child{border-bottom:none}
  .mv-name{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .mv-d{flex:0 0 auto;white-space:nowrap;font-family:var(--mono);font-size:13px}
  .mv-d.up{color:var(--up)} .mv-d.down{color:var(--down)}

  /* 群列表 */
  .g-row{border-bottom:1px solid rgba(255,255,255,.035)}
  .g-row:last-child{border-bottom:none}
  .g-head{display:flex;align-items:center;gap:12px;padding:12px 4px;cursor:pointer;transition:background .2s}
  .g-head:hover{background:rgba(255,255,255,.02)}
  .g-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
  .g-name .id{color:var(--ink-3);font-family:var(--mono);font-size:11.5px;margin-left:8px}
  .g-cur{flex:0 0 auto;white-space:nowrap;font-family:var(--mono);font-size:14px;color:var(--ink);text-align:right}
  .g-delta{flex:0 0 auto;white-space:nowrap;font-family:var(--mono);font-size:12px;min-width:64px;text-align:right}
  .g-arrow{color:var(--ink-3);font-size:11px;transition:transform .25s}
  .g-row.open .g-arrow{transform:rotate(90deg)}
  .g-body{display:none;padding:4px 4px 16px}
  .g-row.open .g-body{display:block}
  .spark{width:100%;height:120px;display:block}

  .empty{color:var(--ink-3);font-size:13px;text-align:center;padding:30px 0}
  .status{font-size:12.5px;color:var(--ink-3);text-align:center;padding:20px 0}
  .status.err{color:var(--down)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="crumb"><a href="./EC社群自治.html">← 返回社群数据中心</a></div>
    <h1>社群总人数趋势</h1>
  </header>

  <div class="range" id="rangeBtns">
    <button data-d="1">24 小时</button>
    <button data-d="7" class="on">7 天</button>
    <button data-d="30">30 天</button>
  </div>

  <!-- 总人数曲线 -->
  <div class="panel">
    <h2>社群总人数</h2>
    <div class="sub" id="totalSub">每 6 小时采样一次</div>
    <div class="hero-num">
      <b id="totalNow">--</b>
      <span class="delta flat" id="totalDelta"></span>
    </div>
    <svg class="chart" id="totalChart" preserveAspectRatio="none" role="img" aria-label="总人数趋势"></svg>
  </div>

  <!-- EC 全服在线人数曲线 -->
  <div class="panel">
    <h2>EC 全服在线人数</h2>
    <div class="sub" id="ecSub">分钟级采样 · play.easecation.net</div>
    <div class="hero-num">
      <b id="ecNow">--</b>
      <span class="delta flat" id="ecDelta"></span>
    </div>
    <svg class="chart" id="ecChart" preserveAspectRatio="none" role="img" aria-label="EC 全服在线趋势"></svg>
  </div>

  <!-- 涨跌榜 -->
  <div class="panel">
    <h2>涨跌榜（对比所选范围起点）</h2>
    <div class="movers">
      <div><div class="sub">📈 增长最快</div><div id="upList"><div class="empty">数据攒集中…</div></div></div>
      <div><div class="sub">📉 流失最多</div><div id="downList"><div class="empty">数据攒集中…</div></div></div>
    </div>
  </div>

  <!-- 各群曲线 -->
  <div class="panel">
    <h2>各群曲线</h2>
    <div class="sub">点击任意一行展开该群的曲线</div>
    <div id="groupList"><div class="status">加载中…</div></div>
  </div>

  <p class="status" id="footNote"></p>
</div>

<script src="./data.js"></script>
<script src="./sfx.js"></script>
<script src="./nbs-sync.js"></script>
<script>
/* 从主页面跳来时，若之前在播放则续播（仅在上次确实播放过时才触发，不打扰静音访客） */
if(window.EC_NBS){ EC_NBS.resumeIfPlayed(); }
</script>
<script>
(function(){
  "use strict";
  var $ = function(s){return document.querySelector(s)};
  var D = window.EC_DATA || {};
  var groups = [];
  (D.official||[]).forEach(function(g){ if(g.id) groups.push(g); });
  (D.player||[]).forEach(function(g){ if(g.id) groups.push(g); });
  var nameOf = {}; groups.forEach(function(g){ nameOf[g.id]=g.name; });

  var curDays = 7, cache = {};

  /* ---------- 画图（纯 SVG，QQ/微信浏览器兼容） ---------- */
  var SVGNS = "http://www.w3.org/2000/svg";
  function drawLine(svg, pts, opts){
    opts = opts || {};
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    var W = svg.clientWidth || 300, H = svg.clientHeight || 120;
    svg.setAttribute("viewBox", "0 0 "+W+" "+H);
    function el(tag, attrs){
      var e = document.createElementNS(SVGNS, tag);
      for(var k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }
    if(!pts || pts.length < 2){
      var t0 = el("text",{x:W/2, y:H/2, "text-anchor":"middle", fill:"#5a5448", "font-size":12});
      t0.textContent = "数据攒集中，采样满两个点后出图";
      svg.appendChild(t0); return;
    }
    var pad = {l:opts.yAxis?46:6, r:8, t:10, b:opts.xAxis?22:8};
    var x0=pad.l, x1=W-pad.r, y0=H-pad.b, y1=pad.t;
    var vals = pts.map(function(p){return p[1]});
    var max = Math.max.apply(null,vals), min = Math.min.apply(null,vals);
    if(max===min){ max+=1; min=Math.max(0,min-1); }
    function X(i){ return x0+(x1-x0)*i/(pts.length-1); }
    function Y(v){ return y0-((v-min)/(max-min))*(y0-y1); }
    var color = opts.color||"#ffca34";

    // 网格 + Y 轴
    if(opts.yAxis){
      for(var i=0;i<=4;i++){
        var gy=y0-(y0-y1)*i/4;
        svg.appendChild(el("line",{x1:x0,y1:gy,x2:x1,y2:gy,stroke:"rgba(255,255,255,.07)","stroke-width":1}));
        var lt = el("text",{x:4, y:gy+3, fill:"#5a5448", "font-size":10});
        lt.textContent = Math.round(min+(max-min)*i/4);
        svg.appendChild(lt);
      }
    }
    // 折线路径
    var dpath = "";
    pts.forEach(function(p,i){
      dpath += (i?"L":"M")+X(i).toFixed(1)+" "+Y(p[1]).toFixed(1);
    });
    // 渐变填充（先画填充再画线）
    if(opts.fill !== "none"){
      var fpath = dpath + "L"+x1.toFixed(1)+" "+y0.toFixed(1)+"L"+x0.toFixed(1)+" "+y0.toFixed(1)+"Z";
      svg.appendChild(el("path",{d:fpath, fill:opts.fill||"rgba(255,202,52,.10)", stroke:"none"}));
    }
    svg.appendChild(el("path",{d:dpath, fill:"none", stroke:color, "stroke-width":1.8, "stroke-linejoin":"round", "stroke-linecap":"round"}));
    // 末端点
    var lx=X(pts.length-1), ly=Y(vals[vals.length-1]);
    svg.appendChild(el("circle",{cx:lx, cy:ly, r:3.2, fill:color}));
    // X 轴时间
    if(opts.xAxis){
      var f=function(d){return (d.getMonth()+1)+"/"+d.getDate()+" "+(d.getHours()<10?"0":"")+d.getHours()+":00"};
      var t1=el("text",{x:x0, y:H-5, fill:"#5a5448", "font-size":10});
      t1.textContent = f(new Date(pts[0][0])); svg.appendChild(t1);
      var t2=el("text",{x:x1, y:H-5, fill:"#5a5448", "font-size":10, "text-anchor":"end"});
      t2.textContent = f(new Date(pts[pts.length-1][0])); svg.appendChild(t2);
    }
  }

  function fmtDelta(n){
    if(n>0) return '<span class="mv-d up">↑ +'+n.toLocaleString()+'</span>';
    if(n<0) return '<span class="mv-d down">↓ '+n.toLocaleString()+'</span>';
    return '<span class="mv-d" style="color:var(--ink-3)">— 0</span>';
  }

  /* ---------- 加载与渲染 ---------- */
  function load(days){
    curDays = days;
    document.querySelectorAll("#rangeBtns button").forEach(function(b){
      b.classList.toggle("on", +b.dataset.d===days);
    });
    /* 同域代理 ./api/history（服务器端读 GitHub 最新数据，国内手机可通）；代理异常时回退站点同源副本 */
    var p = cache.all ? Promise.resolve(cache.all) :
      fetch("./api/history?_="+Date.now())
        .then(function(r){ return r.ok ? r.json() : null; })
        .catch(function(){ return null; })
        .then(function(j0){
          if(j0) return j0;
          return fetch("./history.json?_="+Date.now()).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
        })
        .then(function(j){ cache.all=j; return j; });

    p.then(function(j){
      var cutoff = Date.now() - days*864e5;
      var pts = (j.points||[]).map(function(p){
        var g = p.g || {};
        var total = 0; Object.keys(g).forEach(function(k){ total += g[k]; });
        return {ts: p.ts, total: total, groups: g, c: p.c, t: p.t, ec: (typeof p.ec==="number"?p.ec:null)};
      }).filter(function(p){return p.ts>=cutoff});
      /* 推断完整度：新点看 c 字段，老点用群数占比推断，漏群的点不纳入总人数曲线 */
      var expN = 0;
      pts.forEach(function(p){
        if(typeof p.t==="number" && p.t>expN) expN=p.t;
        var gn=Object.keys(p.groups).length; if(gn>expN) expN=gn;
      });
      pts.forEach(function(p){
        p._inc = (typeof p.c==="number") ? p.c<0.9
               : (expN>0 && Object.keys(p.groups).length < expN*0.9);
      });
      renderTotal(pts);
      renderEC(pts);
      renderGroups(pts);
      var incN = pts.filter(function(p){ return p._inc; }).length;
      $("#footNote").textContent = "共 "+pts.length+" 个采样点 · 每 6 小时自动记录一次 · 历史从首次采样起累积"
        + (incN ? " · 已剔除 "+incN+" 个漏群的不完整采样点" : "")
        + (j.updated ? " · 最近采样 "+j.updated : "");
    }).catch(function(e){
      $("#footNote").textContent = "历史数据暂不可用：" + e.message + "（等待 GitHub Actions 首次采样，或检查 history.json 是否已生成）";
      $("#footNote").className = "status err";
      $("#groupList").innerHTML = '<div class="empty">等待首次采样…</div>';
    });
  }

  function renderTotal(pts){
    var cpts = pts.filter(function(p){ return !p._inc; });  /* 漏群的不完整点会造成假性暴跌，剔除 */
    var tp = cpts.map(function(p){return [p.ts, p.total]});
    if(!tp.length){ $("#totalNow").textContent="--"; drawLine($("#totalChart"),[]); return; }
    var last = tp[tp.length-1][1], first = tp[0][1], diff = last-first;
    $("#totalNow").textContent = last.toLocaleString();
    var d = $("#totalDelta");
    d.className = "delta " + (diff>0?"up":diff<0?"down":"flat");
    d.textContent = (diff>0?"↑ +":diff<0?"↓ ":"") + (diff!==0?diff.toLocaleString():"持平") + " · 区间内";
    var firstT = new Date(tp[0][0]);
    $("#totalSub").textContent = "每 6 小时采样 · 区间起点 " + firstT.toLocaleString("zh-CN");
    drawLine($("#totalChart"), tp, {yAxis:true, xAxis:true});
  }

  /* EC 全服在线人数曲线（分钟级采样，蓝色调区分） */
  function renderEC(pts){
    var ep = pts.filter(function(p){ return typeof p.ec==="number"; })
                .map(function(p){ return [p.ts, p.ec]; });
    if(!ep.length){
      $("#ecNow").textContent="--";
      $("#ecDelta").textContent="";
      $("#ecSub").textContent = "等待首次采样 · 配置 cron 后每分钟自动记录";
      drawLine($("#ecChart"), []);
      return;
    }
    var last = ep[ep.length-1][1], first = ep[0][1], diff = last-first;
    $("#ecNow").textContent = last.toLocaleString();
    var d = $("#ecDelta");
    d.className = "delta " + (diff>0?"up":diff<0?"down":"flat");
    d.textContent = (diff>0?"↑ +":diff<0?"↓ ":"") + (diff!==0?diff.toLocaleString():"持平") + " · 区间内";
    $("#ecSub").textContent = "分钟级采样 · " + ep.length + " 个点 · 当前模式见服务器 MOTD";
    drawLine($("#ecChart"), ep, {yAxis:true, xAxis:true, color:"#7dd3fc", fill:"rgba(125,211,252,.10)"});
  }

  function renderGroups(pts){
    // 计算每个群首末值
    var info = {};
    pts.forEach(function(p){
      Object.keys(p.groups).forEach(function(id){
        if(!info[id]) info[id]={first:null,last:null,series:[]};
        var c = p.groups[id];
        if(info[id].first===null) info[id].first=c;
        info[id].last=c;
        info[id].series.push([p.ts,c]);
      });
    });
    var rows = Object.keys(info).map(function(id){
      var it = info[id];
      /* 判断是否在区间起点就有数据：没有则是新出现/恢复，不算增长 */
      var hadAtStart = pts.length>0 && pts[0].groups && (id in pts[0].groups);
      return {
        id: id, name: nameOf[id]||("群 "+id),
        first: it.first, last: it.last,
        delta: hadAtStart ? (it.last - it.first) : null,
        isNew: !hadAtStart,
        series: it.series
      };
    });

    // 涨跌榜（排除新出现的群）
    var ups = rows.filter(function(r){return r.delta!==null && r.delta>0}).sort(function(a,b){return b.delta-a.delta}).slice(0,5);
    var downs = rows.filter(function(r){return r.delta!==null && r.delta<0}).sort(function(a,b){return a.delta-b.delta}).slice(0,5);
    $("#upList").innerHTML = ups.length ? ups.map(function(r){
      return '<div class="mv-row"><span class="mv-name">'+esc(r.name)+'</span>'+fmtDelta(r.delta)+'</div>';
    }).join("") : '<div class="empty">暂无增长</div>';
    $("#downList").innerHTML = downs.length ? downs.map(function(r){
      return '<div class="mv-row"><span class="mv-name">'+esc(r.name)+'</span>'+fmtDelta(r.delta)+'</div>';
    }).join("") : '<div class="empty">暂无流失</div>';

    // 群列表（按当前人数排序）
    rows.sort(function(a,b){return (b.last||0)-(a.last||0)});
    var box = $("#groupList");
    if(!rows.length){ box.innerHTML='<div class="empty">暂无历史数据，等待首次采样…</div>'; return; }
    box.innerHTML = "";
    rows.forEach(function(r, i){
      var row = document.createElement("div"); row.className="g-row";
      row.innerHTML =
        '<div class="g-head">'+
          '<span class="g-name">'+esc(r.name)+'<span class="id">'+r.id+'</span></span>'+
          '<span class="g-delta">'+(r.isNew?'<span style="color:var(--ink-3);font-size:11px">新出现</span>':r.delta>0?'<span class="mv-d up">+'+r.delta+'</span>':r.delta<0?'<span class="mv-d down">'+r.delta+'</span>':'<span style="color:var(--ink-3)">0</span>')+'</span>'+
          '<span class="g-cur">'+(r.last!==null?r.last.toLocaleString():"--")+'</span>'+
          '<span class="g-arrow">▶</span>'+
        '</div>'+
        '<div class="g-body"><svg class="spark" preserveAspectRatio="none"></svg></div>';
      row.querySelector(".g-head").addEventListener("click", function(){
        var open = row.classList.toggle("open");
        if(window.EC_SFX) EC_SFX.play(open ? "open" : "click");
        if(open) drawLine(row.querySelector(".spark"), r.series, {yAxis:true, xAxis:true, color:"#7dd3fc", fill:"rgba(125,211,252,.08)"});
      });
      box.appendChild(row);
    });
  }

  function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

  $("#rangeBtns").addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(b){ if(window.EC_SFX) EC_SFX.play("click"); load(+b.dataset.d); }
  });
  load(7);
})();
</script>
</body>
</html>
