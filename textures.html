<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>素材空间 · Minecraft 贴图 | EC玩家社群站</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0a0a12;--panel:#10101a;--line-soft:rgba(255,255,255,.06);--line:rgba(255,202,52,.10);
    --ink:#e8e4dc;--ink-2:#8a8578;--ink-3:#5a5448;
    --gold:#ffca34;--up:#6fbf73;--down:#e06c7d;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  html,body{overflow-x:hidden}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}

  /* 顶部 */
  .header{position:sticky;top:0;z-index:100;background:rgba(10,10,18,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,215,0,.08);padding:0 20px;height:50px;display:flex;align-items:center;gap:12px}
  .header-title{font-size:16px;font-weight:600;color:#e8e4dc;white-space:nowrap}
  .header-sub{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .site-nav-btn{display:flex;align-items:center;gap:4px;padding:0 12px;height:34px;border-radius:8px;background:rgba(255,215,0,.06);color:#8a8478;border:none;font-size:13px;font-family:inherit;cursor:pointer;transition:all .2s}
  .site-nav-btn:active{background:rgba(255,215,0,.15);color:#b09a68}
  @media(hover:hover){.site-nav-btn:hover{background:rgba(255,215,0,.15);color:#b09a68}}
  .searchbox{flex:1;min-width:0;max-width:340px;margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--line-soft);border-radius:9px;padding:0 12px;height:34px}
  .searchbox input{flex:1;min-width:0;background:none;border:none;color:var(--ink);font-size:13px;font-family:inherit;outline:none}
  .searchbox input::placeholder{color:var(--ink-3)}
  .searchbox svg{width:15px;height:15px;stroke:var(--ink-3);flex-shrink:0}
  .count-pill{font-size:11px;color:var(--ink-3);font-family:var(--mono);white-space:nowrap;background:rgba(255,255,255,.04);border:1px solid var(--line-soft);padding:4px 10px;border-radius:999px}
  .quality-btn{height:34px;flex-shrink:0;padding:0 12px;border-radius:9px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:#8a8478;font-size:12px;cursor:pointer;transition:all 0.2s;white-space:nowrap;font-family:inherit}
  .quality-btn:active{transform:scale(0.94)}
  .quality-btn.on{background:rgba(255,215,0,0.12);color:#FFD700;border-color:rgba(255,215,0,0.3)}
  /* 画质设置弹窗（4 档：压缩/省流/流畅/原图） */
  .qpop{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center}
  .qpop-mask{position:absolute;inset:0;background:rgba(8,10,16,.62);backdrop-filter:blur(3px)}
  .qpop-panel{position:relative;width:min(92vw,360px);background:#1a1d26;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:18px 16px 16px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .qpop-title{font-size:15px;font-weight:700;color:#eee}
  .qpop-tip{font-size:11px;color:#8a8478;margin:2px 0 12px}
  .qpop-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .qcol{display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.03);border-radius:12px;padding:10px 8px}
  .col-h{font-size:10px;color:#8a8478;text-align:center;letter-spacing:.1em;margin-bottom:2px;display:flex;align-items:center;justify-content:center;gap:4px}
  .col-h svg{width:13px;height:13px}
  .qopt{display:flex;flex-direction:column;align-items:center;gap:1px;width:100%;padding:10px 0 9px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.05);color:#d9d4c9;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
  .qopt svg{width:19px;height:19px;margin-bottom:2px;color:#b8b1a4}
  .qopt small{display:block;font-size:10px;font-weight:400;color:#8a8478}
  .qopt:active{transform:scale(.96)}
  .qopt.on{background:rgba(255,215,0,.14);color:#FFD700;border-color:rgba(255,215,0,.35)}
  .qopt.on svg{color:#FFD700}
  .qopt.on small{color:#cbb45a}
  .verbar{display:flex;align-items:center;gap:4px;flex-shrink:1;min-width:0;overflow-x:auto;scrollbar-width:none}
  .verbar::-webkit-scrollbar{display:none}
  .verbar button{height:26px;padding:0 8px;border-radius:7px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:#8a8478;font-size:11px;cursor:pointer;transition:all .18s;font-family:inherit;white-space:nowrap;flex-shrink:0}
  .verbar button:active{transform:scale(0.94)}
  .verbar button.on{background:rgba(255,215,0,0.12);color:#FFD700;border-color:rgba(255,215,0,0.3);font-weight:500}

  /* 三栏布局 */
  .layout{display:grid;grid-template-columns:210px minmax(0,1fr) 300px;gap:0;height:calc(100vh - 50px)}
  .side{border-right:1px solid var(--line-soft);overflow-y:auto;padding:14px 10px;background:rgba(255,255,255,.015)}
  .side h3{font-size:11px;color:var(--ink-3);letter-spacing:.16em;padding:0 10px 10px;font-weight:600}
  .cat{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;color:var(--ink-2);cursor:pointer;font-size:13px;transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
  .cat:hover{color:var(--ink);background:rgba(255,255,255,.04)}
  .cat.on{color:var(--gold);background:rgba(255,215,0,.09);font-weight:500}
  .cat .cnt{margin-left:auto;font-size:10.5px;font-family:var(--mono);color:var(--ink-3)}
  .cat.on .cnt{color:rgba(255,202,52,.6)}
  .cat .icon{width:20px;text-align:center;flex-shrink:0}
  .cat .icon img.cicon{width:18px;height:18px;object-fit:contain;image-rendering:pixelated;display:inline-block;vertical-align:middle;filter:drop-shadow(0 1px 0 rgba(0,0,0,0.55))}

  /* 中部网格 */
  .grid-wrap{overflow-y:auto;padding:16px}
  .grid-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .grid-head b{font-size:15px;color:var(--ink)}
  .grid-head span{font-size:12px;color:var(--ink-3)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
  .cell{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .16s;position:relative}
  .cell:hover{border-color:rgba(255,202,52,.4);transform:translateY(-1px)}
  .cell.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 4px 14px rgba(255,202,52,.12)}
  .cell .thumb{position:relative;width:100%;height:0;padding-bottom:100%;background:
    conic-gradient(from 90deg at 50% 50%, #17171f 25%, #1c1c26 0 50%, #17171f 0 75%, #1c1c26 0);
    background-size:18px 18px}
  /* isometric 3D 贴图方块：canvas 等距渲染（MC 物品栏视角），全内核兼容，不依赖 CSS 3D */
  .cell .thumb .iso3d{position:absolute;left:50%;top:50%;width:82%;height:82%;transform:translate(-50%,-50%);touch-action:pan-y;cursor:grab}
  .cell .thumb .iso3d canvas{width:100%;height:100%;display:block}
  .cell .thumb img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64%;height:64%;object-fit:contain;image-rendering:pixelated;-ms-interpolation-mode:nearest-neighbor}
  .cell .nm{font-size:10.5px;color:var(--ink-2);padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
  .cell .nm b{display:block;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .nm i{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--ink-3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{padding:60px 20px;text-align:center;color:var(--ink-3);font-size:13px}
  /* 加载更多按钮 */
  .load-more{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:16px;padding:12px;border-radius:12px;border:1px solid rgba(255,215,0,.18);background:rgba(255,215,0,.05);color:var(--gold);font-size:13.5px;font-family:inherit;cursor:pointer;transition:all .18s}
  .load-more:active{transform:scale(.98);background:rgba(255,215,0,.1)}
  .load-more:disabled{opacity:.45;cursor:default;transform:none;background:rgba(255,255,255,.03);border-color:var(--line-soft);color:var(--ink-3)}
  .load-more .lm-count{font-size:11px;color:rgba(255,202,52,.6);font-family:var(--mono)}
  .load-more:disabled .lm-count{color:var(--ink-3)}
  .lm-spin{display:inline-block;width:15px;height:15px;flex-shrink:0}
  /* 动画贴图 */
  .cell .thumb{position:relative}
  .ts{display:block;width:100%;padding-top:100%;background-repeat:no-repeat;background-size:100% auto;image-rendering:pixelated}
  .anim-badge{position:absolute;right:4px;bottom:4px;z-index:2;display:flex;align-items:center;gap:3px;padding:2px 5px;border-radius:6px;background:rgba(0,0,0,.55);color:#ffd257;font-size:9.5px;border:1px solid rgba(255,210,87,.35);pointer-events:none}
  .anim-badge svg{width:9px;height:9px}
  /* 详情动画 */
  .stage{position:relative}
  .d-anim-ctl{display:none;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .d-anim-ctl.show{display:flex}
  .d-anim-ctl .chip{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:8px;background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.18);color:#ffd257;font-size:11.5px}
  .d-anim-ctl .chip svg{width:11px;height:11px}
  .d-anim-ctl button{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:8px;border:1px solid rgba(255,215,0,.25);background:rgba(255,215,0,.08);color:#ffd257;font-size:12px;font-family:inherit;cursor:pointer}
  .d-anim-ctl button:active{background:rgba(255,215,0,.16)}
  .d-anim-ctl .swing-btn{border-color:rgba(255,120,90,.4);background:rgba(255,120,90,.08);color:#ff9a7a}
  .d-anim-ctl .swing-btn:active{background:rgba(255,120,90,.16)}
  .d-anim-ctl .spin-btn{border-color:rgba(90,200,255,.4);background:rgba(90,200,255,.08);color:#8fd6ff}
  .d-anim-ctl .spin-btn:active{background:rgba(90,200,255,.16)}
  /* 剑挥砍演示（一次性 CSS 动画，播完自动移除，无常驻开销） */
  @keyframes ec-swing{0%{transform:rotate(-38deg) translate(-8px,3px)}22%{transform:rotate(58deg) translate(4px,-10px)}48%{transform:rotate(-22deg) translate(12px,6px)}72%{transform:rotate(78deg) translate(2px,-6px)}100%{transform:rotate(64deg) translate(0,0)}}
  .swinging{animation:ec-swing .62s cubic-bezier(.36,.07,.19,.97) 1}
  .swinging-ghost{position:absolute;inset:0;background-size:contain;background-repeat:no-repeat;background-position:center;opacity:.28;filter:blur(1.5px);pointer-events:none}
  /* 旋转展示（一次性 3D 旋转，播完自动移除） */
  @keyframes ec-spin3d{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}
  .spinning{animation:ec-spin3d 1.2s ease-in-out 1}
  #dStage{perspective:700px}

  /* 右栏详情 */
  .detail{border-left:1px solid var(--line-soft);overflow-y:auto;padding:18px 16px;background:rgba(255,255,255,.015)}
  .detail .placeholder{color:var(--ink-3);font-size:13px;text-align:center;padding:40px 0;line-height:2}
  .detail .stage{background:
    conic-gradient(from 90deg at 50% 50%, #17171f 25%, #1c1c26 0 50%, #17171f 0 75%, #1c1c26 0);
    background-size:22px 22px;border:1px solid var(--line-soft);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:26px 10px;margin-bottom:14px}
  .detail .stage img{width:150px;height:150px;object-fit:contain;image-rendering:pixelated;-ms-interpolation-mode:nearest-neighbor}
  .detail h4{font-size:15px;color:var(--ink);margin-bottom:2px;word-break:break-all}
  .detail .sub{font-size:11px;color:var(--ink-3);font-family:var(--mono);word-break:break-all;margin-bottom:10px}
  .detail .meta{font-size:11.5px;color:var(--ink-2);margin-bottom:14px}
  .detail .acts{display:flex;flex-direction:column;gap:8px}
  .detail .acts a,.detail .acts button{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;border-radius:10px;font-size:13px;cursor:pointer;text-decoration:none;border:1px solid var(--line-soft);font-family:inherit;transition:all .18s}
  .detail .dl{background:linear-gradient(160deg,#ffe08a 0%,#ffca34 55%,#eda91c 100%);border:none;color:#14100a;font-weight:600}
  .detail .dl:active{transform:scale(.97)}
  .detail .copy{background:rgba(255,255,255,.045);color:var(--ink-2)}
  .detail .copy:hover{color:var(--gold);border-color:rgba(255,202,52,.4)}
  .detail .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .detail .tags span{font-size:10.5px;color:var(--ink-3);background:rgba(255,255,255,.04);border:1px solid var(--line-soft);padding:2px 8px;border-radius:999px}

  /* 站点导航模态 */
  .site-nav-mask{position:fixed;inset:0;z-index:1200;background:rgba(10,10,18,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px}
  .site-nav-mask.open{display:flex;animation:fadeIn .2s ease}
  .site-nav-card{width:100%;max-width:400px;text-align:center}
  .site-nav-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;padding:0 4px}
  .site-nav-head h2{font-size:18px;font-weight:600;color:#e8e4dc;margin:0}
  .site-nav-close{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.06);color:#8a8478;border:none;font-size:18px;cursor:pointer}
  .site-nav-list{display:flex;flex-direction:column;gap:12px}
  .site-nav-item{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);color:#e8e4dc;text-decoration:none;font-size:15px;transition:all .2s}
  @media(hover:hover){.site-nav-item:hover{background:rgba(255,215,0,.08);border-color:rgba(255,215,0,.2)}}
  .site-nav-item.current{background:rgba(255,215,0,.08);border-color:rgba(255,215,0,.2);color:#FFD700;cursor:default}
  .site-nav-item .cur-tag{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(255,215,0,.15);color:#FFD700;border:1px solid rgba(255,215,0,.2)}
  .site-nav-foot{margin-top:24px;font-size:12px;color:#5a5448}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* 桌面端隐藏弹层辅助（须在 media query 之前声明，手机端覆盖） */
  .detail-bar{display:none}
  .detail-mask{display:none}

  /* 移动端：分类变顶栏横滑，详情变底部弹层 */
  @media(max-width:980px){
    .layout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);height:auto;min-height:calc(100vh - 50px)}
    .side{border-right:none;border-bottom:1px solid var(--line-soft);overflow-x:auto;overflow-y:hidden;padding:10px;display:flex;gap:6px;white-space:nowrap}
    .side h3{display:none}
    .cat{width:auto;padding:7px 12px;flex-shrink:0}
    .cat .cnt{display:none}
    .grid-wrap{padding:14px;min-height:40vh}
    .detail{position:fixed;left:0;right:0;bottom:0;z-index:600;max-height:60vh;min-height:0;border-left:none;border-top:1px solid rgba(255,215,0,.2);border-radius:18px 18px 0 0;background:linear-gradient(200deg,#12121d,#0b0b13);box-shadow:0 -14px 44px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .3s cubic-bezier(.22,1,.36,1);padding:0 16px 16px}
    .detail.open{transform:translateY(0)}
    .detail .placeholder{display:none}
    .detail-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 6px}
    .detail-bar b{font-size:13px;color:var(--ink-3);letter-spacing:.08em}
    .detail-close{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.07);color:var(--ink-2);border:none;font-size:15px;cursor:pointer;line-height:1}
    .detail-close:active{background:rgba(255,255,255,.14)}
    .detail .stage{display:flex;align-items:center;justify-content:center;padding:8px 10px;margin-bottom:10px;background:
      conic-gradient(from 90deg at 50% 50%, #17171f 25%, #1c1c26 0 50%, #17171f 0 75%, #1c1c26 0);
      background-size:20px 20px}
    .detail .stage img{width:92px;height:92px}
    .detail .acts{flex-direction:row}
    .detail .acts a,.detail .acts button{flex:1}
    .detail .tags{display:none}
    .detail-mask{display:block;position:fixed;inset:0;z-index:590;background:rgba(4,4,8,.55);opacity:0;pointer-events:none;transition:opacity .25s}
    .detail-mask.on{opacity:1;pointer-events:auto}
    .header-sub{display:none}
    .header{padding:6px 12px;gap:8px;height:auto;flex-wrap:wrap}
    .searchbox{max-width:150px;padding:0 10px;height:32px}
    .count-pill{font-size:10px;padding:3px 8px}
    .site-nav-btn{padding:0 9px;height:32px}
    .header-title{font-size:14px}
    .verbar{order:6;width:100%;overflow-x:auto;gap:5px;padding:2px 0 1px}
    .verbar button{flex-shrink:0;height:28px;padding:0 10px;font-size:11.5px}
    .verbar::-webkit-scrollbar{display:none}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
</head>
<body>

<header class="header">
  <span class="header-title">素材空间</span>
  <button class="site-nav-btn" onclick="openSiteNav()" aria-label="站点导航">
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    <span>导航</span>
  </button>
  <span class="header-sub">Minecraft 贴图 · <b id="verLabel">1.21.9</b></span>
  <div class="verbar" id="verBar">
    <button type="button" data-v="26.1">26.1</button>
    <button type="button" data-v="1.21.9">1.21.9</button>
    <button type="button" data-v="1.20.2">1.20.2</button>
    <button type="button" data-v="1.16.4">1.16.4</button>
    <button type="button" data-v="1.12">1.12</button>
    <button type="button" data-v="1.8.8">1.8.8</button>
    <button type="button" data-v="1.7.10">1.7.10</button>
    <button type="button" data-v="1.6.4">1.6.4</button>
    <button type="button" data-v="1.5.2">1.5.2</button>
  </div>
  <div class="searchbox">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="q" type="search" placeholder="搜索贴图（中/英文）"/>
  </div>
  <button class="quality-btn on" id="qualityBtn" type="button">流畅</button>
  <span class="count-pill" id="countPill">--</span>
</header>

<!-- 画质设置弹窗（4 档：压缩/省流 = 数据流量；流畅/原图 = WiFi） -->
<div class="qpop" id="qPop" style="display:none">
  <div class="qpop-mask" id="qPopMask"></div>
  <div class="qpop-panel">
    <div class="qpop-title">画质设置</div>
    <div class="qpop-tip">点击选择加载画质</div>
    <div class="qpop-cols">
      <div class="qcol">
        <div class="col-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19v-3M10 19v-6M15 19v-9M20 19V7"/></svg>数据流量</div>
        <button class="qopt" data-q="compress" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h6V4M20 14h-6v6"/></svg><b>压缩</b><small>最省流量</small></button>

<script>
  var DATA = window.EC_TEXTURES || {categories:[]};
  /* Cloudinary CDN 优先：映射存在走图床（缩略图自动压缩），否则回退本地 */
  var CDN = window.EC_CDN || {};
  /* 多版本：索引已全量引入，切换时更换 DATA 与 CDN key 前缀 */
  var VERSIONS = ["26.1","1.21.9","1.20.2","1.16.4","1.12","1.8.8","1.7.10","1.6.4","1.5.2"];
  var curVer = "1.21.9";
  try { var sv = localStorage.getItem("ec_textures_ver"); if(VERSIONS.indexOf(sv)>=0) curVer = sv; } catch(e){}
  function getData(v){ return v==="1.21.9" ? (window.EC_TEXTURES||{categories:[]}) : (window["EC_TEXTURES_"+v.replace(/\./g,"")]||{categories:[]}); }
  DATA = getData(curVer);
  function cdnUrl(cat, f){
    var m = CDN[curVer+"/"+cat+"/"+f];
    if(m) return m;
    var fb = curVer==="1.21.9" ? ("./textures/"+cat+"/"+encodeURIComponent(f)) : ("./versions/"+curVer+"/"+cat+"/"+encodeURIComponent(f));
    return fb;
  }
  function cdnThumb(cat, f, w){
    var u = cdnUrl(cat, f);
    if(u.indexOf("res.cloudinary.com")>=0) return u.replace("/image/upload/", "/image/upload/w_"+w+",c_limit,q_auto:good,f_auto/");
    return u;
  }
  /* 画质档位（4 档）：compress 压缩 / lite 省流 = 数据流量；smooth 流畅 / full 原图 = WiFi */
  var curQuality = 'smooth';
  try {
    var qv = localStorage.getItem('ec_textures_quality');
    if(qv==='compress' || qv==='lite' || qv==='smooth' || qv==='full') curQuality = qv;
  } catch(e){}
  var QUALITY_LABEL = { compress:'压缩', lite:'省流', smooth:'流畅', full:'原图' };
  function cdnTransform(u, tr){
    if(u.indexOf("res.cloudinary.com")>=0) return u.replace("/image/upload/", "/image/upload/"+tr+"/");
    return u;
  }
  function qualityUrl(cat, f, w){
    var u = cdnUrl(cat, f);
    if(curQuality==='full') return u;
    if(curQuality==='compress') return cdnTransform(u, "w_96,c_limit,q_30,f_auto");
    if(curQuality==='lite') return cdnTransform(u, "w_140,c_limit,q_auto:eco,f_auto");
    return cdnThumb(cat, f, w);
  }
  var curCat = DATA.categories[0] ? DATA.categories[0].id : null;
  var curFile = null;

  /* 原版贴图图标（分类树） + 原版 UI 音效 */
  var ICON_MAP = {
    "blocks":"https://res.cloudinary.com/dubpl7gp6/image/upload/w_48,c_limit,q_auto:good,f_auto/v1789697128/textures/blocks/grass_block_side.png",
    "items":"https://res.cloudinary.com/dubpl7gp6/image/upload/w_48,c_limit,q_auto:good,f_auto/v1789697384/textures/items/diamond.png",
    "entity":"https://res.cloudinary.com/dubpl7gp6/image/upload/w_48,c_limit,q_auto:good,f_auto/v1789697272/textures/entity/creeper/creeper.png",
    "painting":"https://res.cloudinary.com/dubpl7gp6/image/upload/w_48,c_limit,q_auto:good,f_auto/v1789697479/textures/painting/pigscene.png",
    "environment":"https://res.cloudinary.com/dubpl7gp6/image/upload/w_48,c_limit,q_auto:good,f_auto/v1789697340/textures/environment/sun.png",
    "particle":"https://res.cloudinary.com/dubpl7gp6/image/upload/w_48,c_limit,q_auto:good,f_auto/v1789697492/textures/particle/generic_0.png",
    "misc":"https://res.cloudinary.com/dubpl7gp6/image/upload/w_48,c_limit,q_auto:good,f_auto/v1789697467/textures/misc/credits_vignette.png",
    "map":"https://res.cloudinary.com/dubpl7gp6/image/upload/w_48,c_limit,q_auto:good,f_auto/v1789697461/textures/map/map_background.png",
    "mob_effect":"https://res.cloudinary.com/dubpl7gp6/image/upload/w_48,c_limit,q_auto:good,f_auto/v1789697473/textures/mob_effect/speed.png",
    "effect":"https://res.cloudinary.com/dubpl7gp6/image/upload/w_48,c_limit,q_auto:good,f_auto/v1789697242/textures/effect/dither.png",
    "trims":"https://res.cloudinary.com/dubpl7gp6/image/upload/w_48,c_limit,q_auto:good,f_auto/v1789697521/textures/trims/color_palettes/amethyst.png"
  };
  function ICON(id){ return '<img class="cicon" src="'+ICON_MAP[id]+'" alt="" loading="lazy"/>'; }
  var SFX = (function(){
    var cache = {};
    var K = ["enter","ender","open","close","note","swing","copy","orb","pop"];
    K.forEach(function(n){ var x = new Audio("./assets/mc-ui/sfx/"+n+".ogg"); x.preload = "auto"; cache[n] = x; });
    return function(kind){
      var x = cache[kind] || cache.pop;
      try{ x.currentTime = 0; }catch(e){}
      x.play().catch(function(){});
    };
  })();

  function $(s){ return document.querySelector(s); }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  /* 导航 */
  function openSiteNav(){ document.getElementById('siteNavPanel').classList.add('open'); document.body.style.overflow='hidden'; }
  function closeSiteNav(){ document.getElementById('siteNavPanel').classList.remove('open'); document.body.style.overflow=''; }
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSiteNav(); });

  /* 分类树（entity 子目录展开为二级） */
  function renderSide(){
    var side = $("#side"), html = "<h3>分类</h3>";
    DATA.categories.forEach(function(c){
      html += '<button class="cat'+(c.id===curCat?" on":"")+'" data-cat="'+c.id+'"><span class="icon">'+ICON(c.id)+'</span><span>'+esc(c.name)+'</span><span class="cnt">'+c.count+'</span></button>';
    });
    side.innerHTML = html;
    side.querySelectorAll(".cat").forEach(function(b){
      b.addEventListener("click", function(){
        SFX("orb");
        curCat = b.dataset.cat; curFile = null;
        renderSide(); renderGrid(); renderDetail(null);
      });
    });
  }

  function catById(id){ for(var i=0;i<DATA.categories.length;i++) if(DATA.categories[i].id===id) return DATA.categories[i]; return null; }

  /* ===== 动画系统（rAF 单驱动，仅播放可见单元格；帧切换用 JS 而非 CSS，不吃 GPU） ===== */
  var anims = {};
  function buildAnims(c){
    var stack = {}, seq = {};
    c.files.forEach(function(x){
      if(x.a && x.a > 1) stack[x.f] = {type:"stack", n:x.a, file:x.f};
      var m = x.f.match(/^(.*)_(\d{1,2})\.png$/);
      if(m && !(x.a && x.a > 1)) (seq[m[1]] = seq[m[1]] || []).push(x.f);
    });
    Object.keys(seq).forEach(function(base){
      var fs = seq[base].slice().sort(function(a,b){
        return parseInt(a.match(/_(\d+)\.png$/)[1],10) - parseInt(b.match(/_(\d+)\.png$/)[1],10);
      });
      if(fs.length >= 2) stack[fs[0]] = {type:"seq", n:fs.length, files:fs};
    });
    return stack;
  }
  function animIv(n){ return n<=4 ? 150 : (n<=16 ? 85 : 50); }
  var animCells = new Map(), visSet = new Set(), rafId = null;
  function animStep(t){
    animCells.forEach(function(a, el){
      if(!visSet.has(el) || a.paused) return;
      if(t - a.last < a.iv) return;
      a.last = t;
      a.idx = (a.idx + 1) % a.n;
      a.apply(a.idx);
    });
    rafId = requestAnimationFrame(animStep);
  }
  function startAnim(el, a){ animCells.set(el, a); if(!rafId) rafId = requestAnimationFrame(animStep); }
  function clearAnims(){ animCells.clear(); visSet.clear(); }
  var gridIO = null;
  function watchGrid(){
    if(gridIO) gridIO.disconnect();
    if(!("IntersectionObserver" in window)) return;
    gridIO = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting) visSet.add(e.target); else visSet.delete(e.target); });
    }, {root: document.querySelector(".grid-wrap"), rootMargin:"120px 0px"});
    document.querySelectorAll("#grid .cell[data-anim]").forEach(function(el){ gridIO.observe(el); });
  }
  function regAnims(){
    var c = catById(curCat);
    document.querySelectorAll("#grid .cell[data-anim]").forEach(function(el){
      if(animCells.has(el)) return;
      var a = anims[el.dataset.f]; if(!a) return;
      var inner = el.querySelector(".ts") || el.querySelector("img[data-kind=seq]");
      if(!inner) return;
      startAnim(el, {
        n:a.n, idx:0, iv:animIv(a.n), last:0, paused:false,
        apply:function(k){
          if(a.type==="stack") inner.style.backgroundPositionY = (k/(a.n-1)*100).toFixed(2)+"%";
          else inner.src = qualityUrl(c.id, a.files[k], 200);
        }
      });
    });
    watchGrid();
  }
  function animBadge(){
    return '<span class="anim-badge"><svg viewBox="0 0 12 12" fill="currentColor"><path d="M2 1.5v9l8-4.5z"/></svg>动画</span>';
  }

  /* 网格（分批渲染，点击加载更多） */
  var PAGE = 60, shown = 0, qAll = [];
  function isMobile(){ return window.innerWidth <= 980; }
  var lmBtn = $("#loadMore"), lmText = null, lmSpin = null;

  function syncLm(){
    lmText = lmBtn.querySelector(".lm-text");
    lmSpin = lmBtn.querySelector(".lm-spin");
    var done = shown >= qAll.length;
    lmBtn.disabled = done;
    lmText.textContent = done ? "已全部加载" : "加载更多";
    lmBtn.querySelector(".lm-count").textContent = shown + " / " + qAll.length;
    lmSpin.style.display = "none";
  }
  function renderGrid(){
    var c = catById(curCat), q = ($("#q").value||"").trim().toLowerCase();
    anims = c ? buildAnims(c) : {};
    qAll = c ? c.files.slice() : [];
    if(q) qAll = qAll.filter(function(x){ return x.f.toLowerCase().indexOf(q)>=0 || (x.cn||"").toLowerCase().indexOf(q)>=0; });
    shown = Math.min(PAGE, qAll.length);
    $("#curName").textContent = c ? c.name : "";
    clearAnims();
    var grid = $("#grid");
    if(!qAll.length){ grid.innerHTML = '<div class="empty">没有匹配的贴图</div>'; $("#curInfo").textContent = "共 0 张"; lmBtn.style.display = "none"; return; }
    grid.innerHTML = qAll.slice(0, shown).map(cellHtml).join("");
    $("#curInfo").textContent = "已加载 "+shown+" / 共 "+qAll.length+" 张 · 点击查看大图";
    lmBtn.style.display = "flex";
    syncLm();
    regAnims();
    initIso();
  }
  function cellHtml(x){
    var c = catById(curCat), a = anims[x.f] || null;
    if(a && a.type==="stack"){
      return '<div class="cell'+(x.f===curFile?" on":"")+'" data-f="'+esc(x.f)+'" data-anim="1">'+
        '<div class="thumb"><i class="ts" style="background-image:url(\''+qualityUrl(c.id, x.f, 200)+'\')"></i>'+animBadge()+'</div>'+
        '<div class="nm"><b>'+esc(x.cn||x.f)+'</b><i>'+esc(x.f)+'</i></div></div>';
    }
    if(a && a.type==="seq"){
      return '<div class="cell'+(x.f===curFile?" on":"")+'" data-f="'+esc(x.f)+'" data-anim="1">'+
        '<div class="thumb"><img loading="lazy" data-kind="seq" src="'+qualityUrl(c.id, a.files[0], 200)+'" alt="'+esc(x.cn||x.f)+'"/>'+animBadge()+'</div>'+
        '<div class="nm"><b>'+esc(x.cn||x.f)+'</b><i>'+esc(x.f)+'</i></div></div>';
    }
    var url = qualityUrl(c.id, x.f, 200);
    var alt = esc(x.cn||x.f);
    /* 生物分类：有基岩模型的 → canvas 3D 模型渲染；无（banner/床/船等非生物）→ 平面展示 */
    if(c.id === "entity"){
      var em = (window.EC_ENT_MODELS||{})[x.f];
      if(em){
        return '<div class="cell'+(x.f===curFile?" on":"")+'" data-f="'+esc(x.f)+'">'+
          '<div class="thumb"><canvas class="iso3d" data-f="'+esc(x.f)+'"></canvas></div>'+
          '<div class="nm"><b>'+alt+'</b><i>'+esc(x.f)+'</i></div></div>';
      }
      return '<div class="cell'+(x.f===curFile?" on":"")+'" data-f="'+esc(x.f)+'">'+
        '<div class="thumb"><img loading="lazy" src="'+url+'" alt="'+alt+'"/></div>'+
        '<div class="nm"><b>'+alt+'</b><i>'+esc(x.f)+'</i></div></div>';
    }
    /* 方块/物品/画作等：2D 平面展示 */
    return '<div class="cell'+(x.f===curFile?" on":"")+'" data-f="'+esc(x.f)+'">'+
      '<div class="thumb"><img loading="lazy" src="'+url+'" alt="'+alt+'"/></div>'+
      '<div class="nm"><b>'+alt+'</b><i>'+esc(x.f)+'</i></div></div>';
  }
  /* 生物 3D 模型渲染（基岩版 geometry + 贴图，canvas 等距投影，全内核兼容） */
  var __geoCache = {};
  /* 拖拽旋转视角（缩略图和详情弹窗复用） */
  /* ============ Three.js 3D 渲染器（手动构建每面 BufferGeometry） ============ */
  var __texCache = {};
  function getTex(img){
    var key = img.src;
    if(__texCache[key]) return __texCache[key];
    var t = new THREE.CanvasTexture(img);
    t.magFilter = THREE.NearestFilter;
    t.minFilter = THREE.NearestFilter;
    t.colorSpace = THREE.SRGBColorSpace;
    t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
    __texCache[key] = t;
    return t;
  }
  /* 为单个 cube 构建 BufferGeometry，6 面顶点+UV 完全手动指定 */
  function cubeGeometry(c, tw, th){
    var o = c.origin, s = c.size;
    var ox=o[0], oy=o[1], oz=o[2];
    var sx=s[0], sy=s[1], sz=s[2];
    var uvs = faceUVs(c, tw, th);
    var positions = [];
    var normals = [];
    var uvArr = [];
    function uvRect(name){
      var u = uvs[name];
      if(!u) return [0,1, 1,1, 1,0, 0,0];
      var u0=u.u/tw, u1=(u.u+u.w)/tw;
      var vT=1-u.v/th, vB=1-(u.v+u.h)/th;
      return [u0,vT, u1,vT, u1,vB, u0,vB];
    }
    function addFace(name, verts, nx,ny,nz){
      var uv = uvRect(name);
      /* 两个三角形: TL,TR,BR 和 TL,BR,BL */
      var idx = [0,1,2, 0,2,3];
      for(var i=0;i<6;i++){
        var vi = idx[i];
        positions.push(verts[vi*3], verts[vi*3+1], verts[vi*3+2]);
        normals.push(nx,ny,nz);
        uvArr.push(uv[vi*2], uv[vi*2+1]);
      }
    }
    /* north (-Z)，从 -Z 看：左=-X 右=+X 上=+Y */
    if(sz>0 || true) addFace('north',[
      ox,oy+sy,oz,  ox+sx,oy+sy,oz,  ox+sx,oy,oz,  ox,oy,oz
    ], 0,0,-1);
    /* south (+Z)，从 +Z 看：左=+X 右=-X */
    addFace('south',[
      ox+sx,oy+sy,oz+sz,  ox,oy+sy,oz+sz,  ox,oy,oz+sz,  ox+sx,oy,oz+sz
    ], 0,0,1);
    /* east (+X)，从 +X 看：左=-Z 右=+Z */
    addFace('east',[
      ox+sx,oy+sy,oz,  ox+sx,oy+sy,oz+sz,  ox+sx,oy,oz+sz,  ox+sx,oy,oz
    ], 1,0,0);
    /* west (-X)，从 -X 看：左=+Z 右=-Z */
    addFace('west',[
      ox,oy+sy,oz+sz,  ox,oy+sy,oz,  ox,oy,oz,  ox,oy,oz+sz
    ], -1,0,0);
    /* up (+Y) 俯视：左=-X 右=+X，UV 上=-Z */
    addFace('up',[
      ox,oy+sy,oz,  ox+sx,oy+sy,oz,  ox+sx,oy+sy,oz+sz,  ox,oy+sy,oz+sz
    ], 0,1,0);
    /* down (-Y) 仰视：UV 方向与 up 相同 */
    addFace('down',[
      ox,oy,oz+sz,  ox+sx,oy,oz+sz,  ox+sx,oy,oz,  ox,oy,oz
    ], 0,-1,0);
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(normals,3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uvArr,2));
    return g;
  }
  function buildModel(geo, img, tw, th){
    var root = new THREE.Group();
    var tex = getTex(img);
    var mat = new THREE.MeshLambertMaterial({map:tex, transparent:true, alphaTest:0.15, side:THREE.DoubleSide});
    var boneMap = {};
    (geo.bones||[]).forEach(function(b){ boneMap[b.name] = b; });
    /* 四足动物判别：≥4 个 leg 骨骼，且 body 主方块“高度>深度”（竖直建模需放倒） */
    var legCount = (geo.bones||[]).filter(function(b){ return /leg/i.test(b.name); }).length;
    function bodyNeedsLayDown(b){
      if(!/^body/i.test(b.name)) return false;
      if(legCount < 4) return false;
      var c=(b.cubes||[])[0]; if(!c) return false;
      return c.size[1] > c.size[2]; /* Y高 > Z深 => 竖直建模，需绕X放倒 */
    }
    function makeBone(b, parentB){
      var outer = new THREE.Group();
      var piv = b.pivot || [0,0,0];
      var ppiv = parentB ? (parentB.pivot||[0,0,0]) : [0,0,0];
      /* Three.js 子对象位置是相对父对象的，而 Bedrock pivot 是绝对坐标，
         所以子 group 位置 = 自己pivot - 父pivot */
      outer.position.set(piv[0]-ppiv[0], piv[1]-ppiv[1], piv[2]-ppiv[2]);
      if(b.rotation){
        outer.rotation.order = 'YXZ';
        outer.rotation.x = b.rotation[0]*Math.PI/180;
        outer.rotation.y = b.rotation[1]*Math.PI/180;
        outer.rotation.z = b.rotation[2]*Math.PI/180;
      }
      /* 内层 group 承载本骨方块；四足 body 静息 +90° 只作用于自身方块，
         不传播给头/腿等子骨骼（它们在几何里已是最终世界姿势） */
      var inner = new THREE.Group();
      if(bodyNeedsLayDown(b)) inner.rotation.x = Math.PI/2;
      outer.add(inner);
      if(b.cubes){
        for(var j=0;j<b.cubes.length;j++){
          var c = b.cubes[j];
          var s = c.size;
          if(s[0]===0 && s[1]===0 && s[2]===0) continue;
          var g3 = cubeGeometry(c, tw, th);
          var mesh = new THREE.Mesh(g3, mat);
          /* cube origin 是绝对坐标，mesh 相对自己 bone pivot 定位 */
          mesh.position.set(
            c.origin[0]+s[0]/2 - piv[0],
            c.origin[1]+s[1]/2 - piv[1],
            c.origin[2]+s[2]/2 - piv[2]
          );
          inner.add(mesh);
        }
      }
      return outer;
    }
    var groups = {};
    (geo.bones||[]).forEach(function(b){
      groups[b.name] = makeBone(b, b.parent ? boneMap[b.parent] : null);
    });
    (geo.bones||[]).forEach(function(b){
      if(b.parent && groups[b.parent]) groups[b.parent].add(groups[b.name]);
      else root.add(groups[b.name]);
    });
    return root;
  }
  function renderModel(cv, geo, img, yawDeg, pitchDeg){
    var tw = geo.description.texture_width;
    var th = geo.description.texture_height;
    var sz = cv.offsetWidth || 96;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    if(cv._threeR){ try{ cv._threeR.dispose(); }catch(e){} }
    var renderer = new THREE.WebGLRenderer({canvas:cv, alpha:true, antialias:false});
    renderer.setSize(sz, sz, false);
    renderer.setPixelRatio(dpr);
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(38, 1, 0.1, 500);
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    var dl = new THREE.DirectionalLight(0xffffff, 0.5);
    dl.position.set(5,12,8); scene.add(dl);
    var dl2 = new THREE.DirectionalLight(0xffffff, 0.3);
    dl2.position.set(-5,8,-5); scene.add(dl2);
    var model = buildModel(geo, img, tw, th);
    scene.add(model);
    var box = new THREE.Box3().setFromObject(model);
    var center = box.getCenter(new THREE.Vector3());
    var size = box.getSize(new THREE.Vector3());
    var maxDim = Math.max(size.x, size.y, size.z, 0.1);
    model.position.sub(center);
    var dist = maxDim * 2.6;
    camera.position.set(dist*0.55, dist*0.4, dist*0.55);
    camera.lookAt(0,0,0);
    /* Bedrock 生物面朝 -Z，旋转 180° 让正面朝相机 */
    model.rotation.y = Math.PI;
    cv._threeR = renderer;
    cv._threeCam = camera;
    cv._threeModel = model;
    cv._threeScene = scene;
    cv._autoDist = dist;
    renderer.render(scene, camera);
  }
  function attachDrag3D(el){
    if(el._dragBound) return;
    el._dragBound = true;
    var dragging=false, lx=0, ly=0;
    function redraw(){ if(el._threeR) el._threeR.render(el._threeScene, el._threeCam); }
    function onDown(x,y){dragging=true;lx=x;ly=y;}
    function onMove(x,y){
      if(!dragging||!el._threeModel) return;
      el._threeModel.rotation.y += (x-lx)*0.008;
      el._pitch2 = Math.max(-1.2, Math.min(1.2, (el._pitch2||0) + (y-ly)*0.005));
      el._threeModel.rotation.x = el._pitch2;
      lx=x; ly=y; redraw();
    }
    function onUp(){dragging=false;}
    el.addEventListener("mousedown", function(e){onDown(e.clientX,e.clientY);e.preventDefault();});
    el.addEventListener("mousemove", function(e){onMove(e.clientX,e.clientY);});
    window.addEventListener("mouseup", onUp);
    el.addEventListener("touchstart", function(e){var t=e.touches[0];onDown(t.clientX,t.clientY);},{passive:true});
    el.addEventListener("touchmove", function(e){
      if(e.touches.length===1){var t=e.touches[0];onMove(t.clientX,t.clientY);e.preventDefault();}
    },{passive:false});
    el.addEventListener("touchend", onUp);
    el.addEventListener("wheel", function(e){
      e.preventDefault();
      if(!el._threeCam) return;
      var f = e.deltaY<0?0.9:1.1;
      var d = Math.max(el._autoDist*0.5, Math.min(el._autoDist*3, el._threeCam.position.length()*f));
      el._threeCam.position.setLength(d);
      el._threeCam.lookAt(0,0,0); redraw();
    },{passive:false});
    var ps=0, pscale=1;
    el.addEventListener("touchstart", function(e){
      if(e.touches.length===2){
        var dx=e.touches[0].clientX-e.touches[1].clientX;
        var dy=e.touches[0].clientY-e.touches[1].clientY;
        ps=Math.sqrt(dx*dx+dy*dy);
        pscale=el._threeCam?el._threeCam.position.length():el._autoDist;
        dragging=false;
      }
    },{passive:true});
    el.addEventListener("touchmove", function(e){
      if(e.touches.length===2){
        var dx=e.touches[0].clientX-e.touches[1].clientX;
        var dy=e.touches[0].clientY-e.touches[1].clientY;
        var dist=Math.sqrt(dx*dx+dy*dy);
        if(ps>0&&el._threeCam){
          var d=Math.max(el._autoDist*0.5,Math.min(el._autoDist*3,pscale*(ps/dist)));
          el._threeCam.position.setLength(d);
          el._threeCam.lookAt(0,0,0); redraw();
        }
        e.preventDefault();
      }
    },{passive:false});
  }

  function loadGeo(url){
    if(__geoCache[url]) return Promise.resolve(__geoCache[url]);
    return fetch(url).then(function(r){ return r.json(); }).then(function(j){
      __geoCache[url] = j["minecraft:geometry"] ? j["minecraft:geometry"][0] : j;
      return __geoCache[url];
    }).catch(function(){ return null; });
  }
  function loadImg(url){
    return new Promise(function(res, rej){
      var im = new Image();
      im.crossOrigin = "anonymous";
      im.onload = function(){ res(im); };
      im.onerror = function(){ rej(new Error("img")); };
      im.src = url;
    });
  }
  /* Blockbench box UV（MC 原版规则）；零厚度薄片只取正/背面，共用整个 uv 区域 */
  function faceUVs(c, tw, th){
    var s = c.size;
    /* per-face UV：Bedrock 模型有些 cube 每个面单独指定 uv */
    if(c.uv && typeof c.uv === "object" && !Array.isArray(c.uv)){
      var F = {};
      var faces = ["north","east","south","west","up","down"];
      for(var i=0;i<faces.length;i++){
        var f = faces[i], fu = c.uv[f];
        if(!fu) continue;
        if(Array.isArray(fu)){
          F[f] = {u:fu[0], v:fu[1], w:fu[2]||s[0], h:fu[3]||s[1]};
        } else {
          var uv = fu.uv || [0,0], us = fu.uv_size || [s[0], s[1]];
          F[f] = {u:uv[0], v:uv[1], w:us[0], h:us[1]};
        }
      }
      return F;
    }
    var u = c.uv[0], v = c.uv[1];
    var F = {};
    if(s[0]===0 || s[1]===0 || s[2]===0){
      if(s[2]===0){ F.north={u:u,v:v,w:s[0],h:s[1]}; F.south={u:u,v:v,w:s[0],h:s[1]}; }
      else if(s[0]===0){ F.west={u:u,v:v+s[2],w:s[2],h:s[1]}; F.east={u:u,v:v+s[2],w:s[2],h:s[1]}; }
      else { F.up={u:u,v:v,w:s[0],h:s[2]}; F.down={u:u,v:v,w:s[0],h:s[2]}; }
      return F;
    }
    F.up   = {u:u+s[2],        v:v,           w:s[0], h:s[2]};
    F.down = {u:u+s[2]+s[0],   v:v,           w:s[0], h:s[2]};
    F.north= {u:u+s[2],        v:v+s[2],      w:s[0], h:s[1]};
    F.south= {u:u+s[2]+s[0],   v:v+s[2],      w:s[0], h:s[1]};
    F.west = {u:u,             v:v+s[2],      w:s[2], h:s[1]};
    F.east = {u:u+s[2]+s[0]+s[0], v:v+s[2],   w:s[2], h:s[1]};
    return F;
  }

    $("#dCopy").textContent = msg;
    setTimeout(function(){ $("#dCopy").textContent = old; }, 1200);
  }

  /* 搜索防抖 */
  var t0 = null;
  $("#q").addEventListener("input", function(){
    clearTimeout(t0);
    t0 = setTimeout(function(){ renderGrid(); }, 180);
  });

  /* 版本切换 */
  function setVer(v){
    if(v === curVer) return;
    curVer = v;
    try{ localStorage.setItem("ec_textures_ver", v); }catch(e){}
    DATA = getData(v);
    $("#verLabel").textContent = v;
    document.querySelectorAll("#verBar button").forEach(function(b){ b.classList.toggle("on", b.dataset.v === v); });
    $("#countPill").textContent = DATA.total + " 张贴图";
    curCat = DATA.categories[0] ? DATA.categories[0].id : null;
    curFile = null;
    closeDetail();
    clearAnims();
    renderSide(); renderGrid();
  }
  document.querySelectorAll("#verBar button").forEach(function(b){
    b.addEventListener("click", function(){ SFX("orb"); setVer(b.dataset.v); });
  });
  (function(){
    document.querySelectorAll("#verBar button").forEach(function(b){ b.classList.toggle("on", b.dataset.v === curVer); });
  })();

  /* 初始化 */
  $("#countPill").textContent = DATA.total + " 张贴图";
  (function(){
    var m = location.search.match(/[?&]cat=([\w-]+)/);
    if(m){
      for(var i=0;i<DATA.categories.length;i++){
        if(DATA.categories[i].id === m[1]){ curCat = m[1]; break; }
      }
    }
  })();
  renderSide(); renderGrid();
</script>
</body>
</html>
