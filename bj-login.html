<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>布吉岛数据接入</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#12100d; color:#e8e2d5; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; padding: 20px; min-height: 100vh; }
  .card { max-width: 420px; margin: 0 auto; background: #1c1915; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 22px; }
  h1 { font-size: 18px; margin-bottom: 6px; color: #ffca34; }
  .sub { font-size: 12.5px; color: #8a8272; line-height: 1.7; margin-bottom: 16px; }
  input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); color: inherit; font-size: 15px; margin-bottom: 10px; }
  button { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #ffca34; color: #1a1508; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; }
  button.ghost { background: rgba(255,255,255,.08); color: #e8e2d5; font-weight: 400; }
  #log { margin-top: 14px; font-size: 12.5px; line-height: 1.7; }
  #log div { color: #9a917d; }
  #log div.ok { color: #34d399; }
  #log div.err { color: #f87171; }
  #capBox { display: none; margin: 4px 0 10px; }
  #capImg { width: 100%; border-radius: 10px; background: #fff; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; margin-bottom: 0; }
  .row button { width: auto; padding: 11px 18px; }
  #result { display: none; margin-top: 14px; background: rgba(52,211,153,.08); border: 1px solid rgba(52,211,153,.25); border-radius: 10px; padding: 12px; font-size: 12.5px; word-break: break-all; }
  #result b { color: #34d399; }
  a { color: #ffca34; }
</style>
</head>
<body>
<div class="card">
  <h1>布吉岛数据接入</h1>
  <div class="sub">
    用任一网易 MC 账号登录一次即可（建议小号），登录态只存在本站数据库里，用于每分钟读取布吉岛在线人数。账密仅用于向网易官方接口换取登录态，不会被保存。
  </div>

  <input id="secret" type="password" placeholder="管理密钥">
  <input id="user" type="text" placeholder="网易账号手机号 / 邮箱，或 4399 账号" autocomplete="username">
  <input id="pass" type="password" placeholder="密码" autocomplete="current-password">

  <div id="capBox">
    <img id="capImg" alt="4399 验证码">
    <div class="row" style="margin-top:8px">
      <input id="capText" type="text" placeholder="输入图中字符">
      <button id="capGo">提交</button>
    </div>
  </div>

  <button id="go">登录并启用采样</button>

  <div id="log"></div>
  <div id="result"></div>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  function say(t, cls){
    var d = document.createElement("div");
    if(cls) d.className = cls;
    d.textContent = t;
    $("log").appendChild(d);
  }
  function call(body){
    return fetch("./api/bj-auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function(r){ return r.json().catch(function(){ return { error: "HTTP " + r.status }; }); });
  }

  $("go").addEventListener("click", function(){
    var secret = $("secret").value.trim(), user = $("user").value.trim(), pass = $("pass").value;
    if(!secret || !user || !pass){ say("请把密钥、账号、密码都填上", "err"); return; }
    var mode = /^1\d{10}$/.test(user) || user.indexOf("@") > 0 ? "netease" : "4399";
    $("go").disabled = true;
    $("log").innerHTML = "";
    $("capBox").style.display = "none";
    say("正在登录（" + (mode === "netease" ? "网易账号" : "4399") + "通道）…");
    call({ action:"web_login", mode:mode, secret:secret, user:user, pass:pass }).then(function(j){
      if(j.needCaptcha){
        $("capImg").src = j.imageBase64;
        $("capBox").style.display = "block";
        say("4399 需要图形验证码：请照着上图输入后点「提交」", "err");
        $("go").disabled = false;
        return;
      }
      if(j.error){ say("登录失败：" + j.error, "err"); $("go").disabled = false; return; }
      say("✅ " + (j.msg || "登录成功"), "ok");
      $("result").style.display = "block";
      $("result").innerHTML = "<b>接入成功</b><br>网易 user-id：" + j.userId + "<br>现在回到 <a href='./trends.html'>人数趋势页</a>，布吉岛曲线下一分钟开始出点。";
    }).catch(function(e){
      say("请求失败：" + e.message + "（网络波动，稍等 1 分钟再点一次）", "err");
      $("go").disabled = false;
    });
  });

  $("capGo").addEventListener("click", function(){
    var secret = $("secret").value.trim(), code = $("capText").value.trim();
    if(!code){ say("请填入图中验证码", "err"); return; }
    say("正在提交验证码…");
    call({ action:"login4399_captcha", secret:secret, code:code }).then(function(j){
      if(j.error){ say("登录失败：" + j.error, "err"); return; }
      $("capBox").style.display = "none";
      say("✅ " + (j.msg || "登录成功"), "ok");
      $("result").style.display = "block";
      $("result").innerHTML = "<b>接入成功</b><br>网易 user-id：" + j.userId + "<br>现在回到 <a href='./trends.html'>人数趋势页</a>，布吉岛曲线下一分钟开始出点。";
    }).catch(function(e){
      say("请求失败：" + e.message, "err");
    });
  });
})();
</script>
</body>
</html>
