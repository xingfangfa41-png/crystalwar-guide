name: 每小时群人数采样

on:
  schedule:
    - cron: "17 * * * *"    # 每小时第 17 分钟（UTC 时间）
  workflow_dispatch:         # 允许手动触发

permissions:
  contents: read             # 不再需要提交回仓库（数据写数据库）

concurrency:
  group: ec-sample           # 防止两次采样重叠

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 运行采样脚本（结果写入 Turso 数据库）
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: python3 scripts/sample.py
