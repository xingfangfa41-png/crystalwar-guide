name: 群人数采样（已停用）

# 群采样已迁移到 Vercel 函数 api/group-sample.js，由 cron-job.org 每 6 小时调用
# 此 workflow 仅保留手动触发作为备用
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec-sample

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 运行采样脚本（结果写入 Turso 数据库）
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: python3 scripts/sample.py
