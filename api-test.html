<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EC 单模式在线人数查询</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0a0a12; --panel:#10101a; --line-soft:rgba(255,255,255,.06);
    --ink:#e8e4dc; --ink-2:#8a8578; --ink-3:#5a5448;
    --gold:#ffca34; --ok:#6fbf73; --bad:#e06c7d;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  }
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;padding:32px 16px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto}
  h1{font-size:22px;letter-spacing:.08em}
  .sub{color:var(--ink-2);font-size:13px;margin-top:6px}
  .bar{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  select{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line-soft);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14px;font-family:inherit;outline:none;cursor:pointer}
  select:focus{border-color:rgba(255,202,52,.55)}
  button{background:none;border:1px solid rgba(255,202,52,.55);color:var(--gold);border-radius:10px;padding:12px 28px;font-size:14px;letter-spacing:.15em;cursor:pointer;font-family:inherit}
  button:hover{background:rgba(255,202,52,.08)}
  .panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:24px;margin-top:18px;display:none}
  .panel.show{display:block}
  .big{font-family:var(--mono);font-size:56px;font-weight:700;color:var(--gold);line-height:1.1;text-align:center;margin-top:6px}
  .big small{font-size:16px;color:var(--ink-3);font-weight:400}
  .meta{text-align:center;font-size:12px;color:var(--ink-3);margin-top:8px;font-family:var(--mono)}
  .stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
  .st{background:#0c0c14;border:1px solid var(--line-soft);border-radius:10px;padding:14px;text-align:center}
  .st b{display:block;font-family:var(--mono);font-size:22px;color:var(--ink)}
  .st span{font-size:11.5px;color:var(--ink-3);letter-spacing:.1em}
  .status{font-size:13px;margin-top:14px;color:var(--ink-2)}
  .status.err{color:var(--bad)}
  .detail{font-size:12px;color:var(--ink-3);margin-top:16px;line-height:2}
  .detail code{color:var(--gold);font-family:var(--mono);font-size:11.5px}
  canvas{width:100%;height:220px;display:block;margin-top:16px}
  .hint{font-size:12px;color:var(--ink-3);margin-top:22px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <h1>EC 单模式在线人数查询</h1>
  <p class="sub">数据源：EaseCation 官方接口 <b style="color:var(--gold)">ecapi/statistics</b>（请求由你的浏览器直接发起）</p>

  <div class="bar">
    <select id="mode">
      <option value="stage.bedwars">水晶战争（bedwars 全部合并）</option>
      <option value="stage.bedwars-solo">水晶战争 · 单人</option>
      <option value="stage.bedwars-due">水晶战争 · 双人</option>
      <option value="stage.bedwars-four">水晶战争 · 四人</option>
      <option value="stage.bedwars-mini">水晶战争 · 迷你</option>
      <option value="stage.bedwars-crazy">水晶战争 · 疯狂</option>
      <option value="stage.sg">饥饿游戏</option>
      <option value="stage.sw-single">空岛战争 · 单人</option>
      <option value="stage.sw-team">空岛战争 · 组队</option>
      <option value="stage.miniwalls">迷你战墙</option>
      <option value="stage.walls">战墙</option>
      <option value="stage.fb">足球</option>
      <option value="lobby.main">主大厅</option>
      <option value="global">全服总人数</option>
    </select>
    <button id="go">查询</button>
  </div>

  <div class="status" id="status"></div>

  <div class="panel" id="result">
    <div class="big" id="curNum">--<small> 人在线</small></div>
    <div class="meta" id="curTime"></div>
    <div class="stats3">
      <div class="st"><b id="sMax">--</b><span>24h 峰值</span></div>
      <div class="st"><b id="sMin">--</b><span>24h 谷值</span></div>
      <div class="st"><b id="sCnt">--</b><span>数据点数</span></div>
    </div>
    <canvas id="cv"></canvas>
  </div>

  <p class="hint">
    说明：接口返回的是最近 24 小时的逐分钟采样，本页取其中<b style="color:var(--ink)">最新一个数据点</b>作为"当前在线"，24h 峰值/谷值供参考。
    若查询失败并提示 <code>mixed-content</code>，说明浏览器拦截了 http 接口请求（https 页面限制）；若提示超时，则接口服务器已下线。
  </p>
</div>

<script>
(function(){
  var $ = function(s){return document.querySelector(s)};
  var API = "http://ntest.easecation.net:25565/ecapi/statistics";
  function fmt(d){function p(n){return (n<10?"0":"")+n}return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes())}

  function draw(points){
    var cv = $("#cv"), ctx = cv.getContext("2d");
    var dpr = devicePixelRatio||1;
    cv.width = cv.clientWidth*dpr; cv.height = 220*dpr; ctx.scale(dpr,dpr);
    var W = cv.clientWidth, H = 220, x0=42, x1=W-10, y0=H-22, y1=10;
    var max = Math.max.apply(null, points.map(function(p){return p[1]})) || 1;
    ctx.strokeStyle="rgba(255,255,255,.08)"; ctx.fillStyle="#8a8578"; ctx.font="11px sans-serif";
    for(var i=0;i<=4;i++){
      var y=y0-(y0-y1)*i/4;
      ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();
      ctx.fillText(Math.round(max*i===0?0:max-(max*i===4?0:(max*0*(i)))-(max*(4-i)/4)*0+ (max*(i)/4)), 4, y+3);
    }
    ctx.beginPath();
    points.forEach(function(p,i){
      var x=x0+(x1-x0)*i/Math.max(points.length-1,1), y=y0-(p[1]/max)*(y0-y1);
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    });
    ctx.strokeStyle="#ffca34";ctx.lineWidth=2;ctx.stroke();
    ctx.lineTo(x1,y0);ctx.lineTo(x0,y0);ctx.closePath();
    ctx.fillStyle="rgba(255,202,52,.12)";ctx.fill();
  }

  function query(){
    var type = $("#mode").value;
    var st = $("#status");
    st.className = "status"; st.textContent = "查询中…";
    $("#result").className = "panel";
    var end = fmt(new Date(Date.now()+60e3)), start = fmt(new Date(Date.now()-864e5));
    var url = API + "?type=" + encodeURIComponent(type+",") + "&start=" + start + "&end=" + end;
    Promise.race([
      fetch(url).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }),
      new Promise(function(_,rej){ setTimeout(function(){rej(new Error("timeout"))}, 15000); })
    ]).then(function(data){
      var list = (Array.isArray(data)?data:(data.data||[])).filter(function(v){return v.type===type});
      if(!list.length){
        // 有的接口实现会按 type 前缀合并返回，宽松匹配一次
        list = (Array.isArray(data)?data:(data.data||[])).filter(function(v){return (v.type||"").indexOf(type.split(".")[1])>-1});
      }
      if(!list.length){
        st.className = "status err";
        st.textContent = "接口有响应，但没有该模式的数据（模式标识可能已变更）。";
        return;
      }
      list.sort(function(a,b){return a.timestamp-b.timestamp});
      var last = list[list.length-1];
      var nums = list.map(function(v){return v.count});
      $("#curNum").innerHTML = last.count.toLocaleString() + '<small> 人在线</small>';
      $("#curTime").textContent = "数据时间 " + new Date(last.timestamp).toLocaleString("zh-CN");
      $("#sMax").textContent = Math.max.apply(null,nums).toLocaleString();
      $("#sMin").textContent = Math.min.apply(null,nums).toLocaleString();
      $("#sCnt").textContent = list.length;
      $("#result").className = "panel show";
      draw(list.map(function(v){return [v.timestamp,v.count]}));
      st.textContent = "";
    }).catch(function(e){
      st.className = "status err";
      var msg = String(e.message||e);
      st.textContent = "查询失败：" + msg +
        (location.protocol==="https:" && msg==="timeout" ? "（可能是 https 页面拦截了 http 接口，或接口已下线）" : "");
    });
  }

  $("#go").addEventListener("click", query);
  query();
})();
</script>
</body>
</html>
