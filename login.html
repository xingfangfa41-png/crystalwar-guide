<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · EC社群自治</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #12100d;
    color: #e8e2d5;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #1c1915;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px;
    padding: 36px 28px 28px;
    text-align: center;
  }
  .logo {
    width: 56px; height: 56px;
    border-radius: 12px;
    margin: 0 auto 16px;
    display: block;
  }
  h1 { font-size: 18px; font-weight: 600; color: #ffca34; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #8a8272; line-height: 1.7; margin-bottom: 28px; }

  /* QQ 官方规范按钮：蓝色 #12B7F5 + 白企鹅 + 白字 */
  .qq-login-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px 16px;
    background: #12B7F5;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background .15s;
  }
  .qq-login-btn:hover { background: #0fa3d9; }
  .qq-login-btn:active { background: #0d90c2; }
  .qq-login-btn svg { flex-shrink: 0; }

  .terms {
    margin-top: 20px;
    font-size: 11.5px;
    color: #6b6355;
    line-height: 1.7;
  }
  .terms a { color: #12B7F5; text-decoration: none; }
  .back {
    display: inline-block;
    margin-top: 18px;
    font-size: 12.5px;
    color: #8a8272;
    text-decoration: none;
  }
  .back:hover { color: #e8e2d5; }
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="./ec-logo.png" alt="EC社群自治">
  <h1>登录 EC 社群自治</h1>
  <p class="sub">使用 QQ 账号一键登录，即可使用二创馆投稿、<br>评论互动等会员功能。</p>

  <!-- QQ 登录按钮（官方规范样式） -->
  <a id="qqLoginBtn" class="qq-login-btn" href="https://graph.qq.com/oauth2.0/authorize?response_type=code&client_id=1905581543&redirect_uri=https%3A%2F%2Fec-crystal-war.com%2Fapi%2Fauth%2Fqq%2Fcallback&scope=get_user_info&state=ec">
    <img src="./assets/qq-logo.png" alt="" width="22" height="22" style="border-radius:4px">
    QQ 登录
  </a>

  <div class="terms">
    登录即代表你已阅读并同意
    <a href="./terms.html">《用户服务协议》</a>与
    <a href="./privacy.html">《隐私政策》</a>
  </div>

  <a class="back" href="./">← 返回首页</a>
</div>
</body>
</html>
