<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>整改中</title>
<meta name="robots" content="noindex, nofollow"/>
<style>
/* SECTION: base */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh;
  background:
    radial-gradient(900px 520px at 50% -8%, rgba(255,215,0,0.07), transparent 62%),
    radial-gradient(700px 460px at 88% 108%, rgba(120,150,255,0.05), transparent 60%),
    #0a0a12;
  color: #e8e4dc;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(24px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
}
.wrap { width: 100%; max-width: 560px; }

/* SECTION: notice-card */
.card {
  background: rgba(255,255,255,0.028);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 18px;
  padding: 30px 24px 26px;
  text-align: center;
  box-shadow: 0 22px 60px rgba(0,0,0,0.45);
}
.seal {
  width: 74px; height: 74px; margin: 0 auto 18px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: radial-gradient(circle at 36% 30%, rgba(255,225,140,0.2), rgba(255,202,52,0.07) 62%, transparent 72%);
  border: 1px solid rgba(255,215,0,0.28);
  color: #FFD700;
  animation: breathe 3.4s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,215,0,0.16); }
  50% { box-shadow: 0 0 26px 4px rgba(255,215,0,0.1); }
}
.kicker {
  font-size: 11.5px; letter-spacing: 0.26em; color: #8a8478;
  text-transform: uppercase; margin-bottom: 10px;
}
h1 { font-size: 23px; font-weight: 650; letter-spacing: 0.05em; margin-bottom: 12px; }
.lede { font-size: 14px; color: #a9a296; }
.rule { height: 1px; background: rgba(255,255,255,0.07); margin: 22px 0 20px; }

/* SECTION: status-list */
.status { text-align: left; display: grid; gap: 11px; }
.status li {
  list-style: none; display: flex; gap: 11px; align-items: flex-start;
  font-size: 13.5px; color: #a9a296;
}
.status .dot {
  flex: 0 0 auto; width: 18px; height: 18px; margin-top: 2px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: rgba(255,215,0,0.12); color: #FFD700;
}
.status .dot svg { width: 11px; height: 11px; }
.status b { color: #e8e4dc; font-weight: 550; }

/* SECTION: author-note */
.note {
  margin-top: 18px; text-align: left;
  background: rgba(255,215,0,0.045);
  border: 1px solid rgba(255,215,0,0.16);
  border-radius: 14px; padding: 16px 16px 15px;
}
.note h2 {
  font-size: 13px; font-weight: 600; color: #FFD700;
  letter-spacing: 0.06em; margin-bottom: 8px;
  display: flex; align-items: center; gap: 7px;
}
.note h2 svg { width: 15px; height: 15px; }
.note p { font-size: 13px; color: #b6aea1; }
.note p + p { margin-top: 7px; }

/* SECTION: actions */
.actions { display: grid; gap: 10px; margin-top: 22px; }
.btn {
  min-height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 12px; font-size: 14px; text-decoration: none;
  transition: transform 0.16s ease, background 0.2s ease, border-color 0.2s ease;
}
.btn:active { transform: scale(0.98); }
.btn svg { width: 16px; height: 16px; }
.btn-primary {
  background: linear-gradient(160deg, #ffe08a 0%, #ffca34 52%, #eda91c 100%);
  color: #14100a; font-weight: 600; border: none;
  box-shadow: 0 8px 22px rgba(255,202,52,0.22);
}
.btn-ghost {
  background: rgba(255,255,255,0.035); color: #a9a296;
  border: 1px solid rgba(255,255,255,0.09);
}
.btn-ghost:active { color: #e8e4dc; border-color: rgba(255,215,0,0.3); }

/* SECTION: footer */
.foot {
  margin-top: 20px; text-align: center;
  font-size: 11.5px; color: #5a5448; letter-spacing: 0.04em;
}

/* SECTION: responsive */
@media (min-width: 720px) {
  .card { padding: 40px 40px 34px; border-radius: 22px; }
  h1 { font-size: 27px; }
  .actions { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .seal { animation: none; }
  .btn { transition: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <!-- SECTION: notice-card -->
    <div class="seal" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 17.5 3 6V3h3l11.5 11.5-3 3z"/>
        <path d="m13 19 6-6"/>
        <path d="m16 16 4 4"/>
        <path d="m19 21 2-2"/>
        <path d="M14.5 6.5 18 3l3 3-3.5 3.5"/>
      </svg>
    </div>
    <h1>整改中</h1>

    <div class="rule"></div>

    <!-- SECTION: actions -->
    <div class="actions">
      <a class="btn btn-primary" href="./EC社群自治.html" data-primary-action>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        返回社群首页
      </a>
      <a class="btn btn-ghost" href="./handbook.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        水晶战争手册
      </a>
    </div>

    <!-- SECTION: footer -->
    <p class="foot">水晶战争玩家二创馆 · 东河 · 2026</p>
  </main>
</div>
</body>
</html>
