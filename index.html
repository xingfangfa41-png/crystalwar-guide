    <div id="root"></div>
    <script>
      // 捕获PWA安装事件
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
      });

      // 注册Service Worker（PWA）
      if ('serviceWorker' in navigator) {
        var swCode = `const CACHE_NAME='ec-community-v1';const urlsToCache=['./','./handbook.html'];self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE_NAME).then(c=>c.addAll(urlsToCache)));self.skipWaiting()});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(n=>Promise.all(n.filter(n=>n!==CACHE_NAME).map(n=>caches.delete(n)))));self.clients.claim()});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(r=>r)))})`;
        var blob = new Blob([swCode], {type: 'application/javascript'});
        var url = URL.createObjectURL(blob);
        window.addEventListener('load', function() {
          navigator.serviceWorker.register(url).catch(function(){console.log('SW skip')})
        });
      }
    </script>
